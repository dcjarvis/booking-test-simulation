<script type="text/babel">
const { useMemo, useState } = React;

// ---------- shared helpers ----------
const INTERVALS = 16; // 09:00-17:00 in 30-min steps
const TRIALS = 1000;
const SAMPLE_DAYS = 10; // two weeks of trading days in the sample data
const SAMPLE_PREVIEW_PER_DAY = 5;

const timeLabel = (i) => {
  const h = 9 + Math.floor(i / 2);
  return `${h}:${i % 2 ? "30" : "00"}`;
};

const DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

// Each trial represents one trading day; dayIndex 0 is the next business day.
function bookingDay(dayIndex) {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + 1);
  let remaining = dayIndex;
  for (;;) {
    const isWeekday = d.getDay() !== 0 && d.getDay() !== 6;
    if (isWeekday) {
      if (remaining === 0) break;
      remaining--;
    }
    d.setDate(d.getDate() + 1);
  }
  const pad = (v) => String(v).padStart(2, "0");
  return {
    day: DAY_NAMES[d.getDay()],
    date: `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`,
  };
}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(arr, rand) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function prefWeights(maxStart, peakBias) {
  const b = peakBias / 100;
  const w = [];
  for (let i = 0; i <= maxStart; i++) {
    const peaks = Math.exp(-((i - 3) ** 2) / 6) + 0.8 * Math.exp(-((i - 10) ** 2) / 6);
    w.push((1 - b) * 1 + b * 2.2 * peaks);
  }
  return w;
}

function sampleIdx(weights, rand) {
  const total = weights.reduce((a, c) => a + c, 0);
  let r = rand() * total;
  for (let i = 0; i < weights.length; i++) {
    r -= weights[i];
    if (r <= 0) return i;
  }
  return weights.length - 1;
}

function validStarts(dur, hourAlign) {
  const out = [];
  for (let s = 0; s <= INTERVALS - dur; s++) {
    if (dur === 4 && hourAlign && s % 2 !== 0) continue;
    out.push(s);
  }
  return out;
}

// ---------- model A: basic (index.html) ----------
function runTrialBasic(p, rand) {
  const occ = new Array(INTERVALS).fill(0);
  const n = p.demand;
  const customers = [];
  for (let k = 0; k < n; k++) {
    customers.push({
      dur: rand() < p.twoHourShare / 100 ? 4 : 2,
      flexible: rand() < p.lastMinuteShare / 100,
    });
  }
  const planners = customers.filter((c) => !c.flexible);
  const flex = customers.filter((c) => c.flexible);
  shuffle(planners, rand);
  shuffle(flex, rand);
  const ordered = [...planners, ...flex];
  const weightsCache = {};
  const startsCache = { 2: validStarts(2, p.hourAlign), 4: validStarts(4, p.hourAlign) };
  const req = { 2: 0, 4: 0 };
  const rej = { 2: 0, 4: 0 };
  for (const c of ordered) {
    req[c.dur]++;
    const cap = c.dur === 2 ? p.seats - p.reserve : p.seats;
    const maxStart = INTERVALS - c.dur;
    if (!weightsCache[c.dur]) weightsCache[c.dur] = prefWeights(maxStart, p.peakBias);
    const pref = sampleIdx(weightsCache[c.dur], rand);
    const feasible = (s) => {
      for (let i = s; i < s + c.dur; i++) if (occ[i] + 1 > cap) return false;
      return true;
    };
    let candidates;
    if (c.flexible) {
      candidates = startsCache[c.dur].filter(feasible);
    } else {
      candidates = startsCache[c.dur].filter((s) => Math.abs(s - pref) <= 1 && feasible(s));
    }
    if (candidates.length === 0) { rej[c.dur]++; continue; }
    let pick;
    if (p.smart) {
      let best = -Infinity;
      for (const s of candidates) {
        let load = 0;
        for (let i = s; i < s + c.dur; i++) load += occ[i];
        const score = load * 100 - Math.abs(s - pref);
        if (score > best) { best = score; pick = s; }
      }
    } else {
      pick = candidates.reduce((a, s) => Math.abs(s - pref) < Math.abs(a - pref) ? s : a, candidates[0]);
    }
    for (let i = pick; i < pick + c.dur; i++) occ[i]++;
  }
  const used = occ.reduce((a, c) => a + c, 0);
  return { occ, used, req, rej };
}

function simulateBasic(p, seed) {
  const rand = mulberry32(seed);
  const occSum = new Array(INTERVALS).fill(0);
  let used = 0, req1 = 0, req2 = 0, rej1 = 0, rej2 = 0;
  for (let t = 0; t < TRIALS; t++) {
    const r = runTrialBasic(p, rand);
    r.occ.forEach((v, i) => (occSum[i] += v));
    used += r.used;
    req1 += r.req[2]; req2 += r.req[4];
    rej1 += r.rej[2]; rej2 += r.rej[4];
  }
  return {
    avgOcc: occSum.map((v) => v / TRIALS),
    utilisation: used / TRIALS / (p.seats * INTERVALS),
    soldSeatHours: used / TRIALS / 2,
    rej1Rate: req1 ? rej1 / req1 : 0,
    rej2Rate: req2 ? rej2 / req2 : 0,
  };
}

// ---------- Model 1: Flow optimised (50/50 stream constraint) ----------
function runTrialFlowOptimised(p, rand, dayIndex = 0) {
  const { day, date } = bookingDay(dayIndex);
  // Each stream has its own seats, so occupancy is tracked per stream
  const occ1h = new Array(INTERVALS).fill(0);
  const occ2h = new Array(INTERVALS).fill(0);
  const n = p.demand;
  
  // Separate capacity into two streams (handle odd seat counts)
  const halfHourCap = Math.ceil(p.seats * 0.5); // 50% for half-hour bookings (round up)
  const hourCap = p.seats - halfHourCap; // Remaining for hour bookings
  
  const customers = [];
  for (let k = 0; k < n; k++) {
    customers.push({
      dur: rand() < p.twoHourShare / 100 ? 4 : 2,
      flexible: rand() < p.lastMinuteShare / 100,
    });
  }
  
  const planners = customers.filter((c) => !c.flexible);
  const flex = customers.filter((c) => c.flexible);
  shuffle(planners, rand);
  shuffle(flex, rand);
  const ordered = [...planners, ...flex];
  
  const weightsCache = {};
  const startsCache = { 2: validStarts(2, p.hourAlign), 4: validStarts(4, p.hourAlign) };
  const req = { 2: 0, 4: 0 };
  const rej = { 2: 0, 4: 0 };
  
  const results = [];
  
  for (const c of ordered) {
    req[c.dur]++;
    // Use stream-specific capacity (reserve applies to 1-hour bookings only)
    const cap = c.dur === 2 ? halfHourCap - p.reserve : hourCap;
    const occ = c.dur === 2 ? occ1h : occ2h;
    const maxStart = INTERVALS - c.dur;
    
    if (!weightsCache[c.dur]) weightsCache[c.dur] = prefWeights(maxStart, p.peakBias);
    const pref = sampleIdx(weightsCache[c.dur], rand);
    
    const feasible = (s) => {
      for (let i = s; i < s + c.dur; i++) if (occ[i] + 1 > cap) return false;
      return true;
    };
    
    let candidates;
    if (c.flexible) {
      candidates = startsCache[c.dur].filter(feasible);
    } else {
      candidates = startsCache[c.dur].filter((s) => Math.abs(s - pref) <= 1 && feasible(s));
    }
    
    if (candidates.length === 0) { rej[c.dur]++; 
      results.push({ day, date, duration: c.dur === 2 ? '1h' : '2h', flexible: c.flexible, accepted: false, startTime: null, model: 'Flow Optimised' });
      continue; }
    
    let pick;
    if (p.smart) {
      let best = -Infinity;
      for (const s of candidates) {
        let load = 0;
        for (let i = s; i < s + c.dur; i++) load += occ[i];
        const score = load * 100 - Math.abs(s - pref);
        if (score > best) { best = score; pick = s; }
      }
    } else {
      pick = candidates.reduce((a, s) => Math.abs(s - pref) < Math.abs(a - pref) ? s : a, candidates[0]);
    }
    
    for (let i = pick; i < pick + c.dur; i++) occ[i]++;
    results.push({ day, date, duration: c.dur === 2 ? '1h' : '2h', flexible: c.flexible, accepted: true, startTime: timeLabel(pick), model: 'Flow Optimised' });
  }
  
  const occ = occ1h.map((v, i) => v + occ2h[i]);
  const used = occ.reduce((a, c) => a + c, 0);
  return { occ, used, req, rej, results };
}

function simulateFlowOptimised(p, seed) {
  const rand = mulberry32(seed);
  const occSum = new Array(INTERVALS).fill(0);
  let used = 0, req1 = 0, req2 = 0, rej1 = 0, rej2 = 0;
  let allResults = [];
  
  // Calculate actual available capacity for fair utilisation comparison
  const halfHourCap = Math.ceil(p.seats * 0.5);
  const hourCap = p.seats - halfHourCap;
  // Account for reserve in capacity calculation
  const totalCapacity = (halfHourCap - p.reserve + hourCap) * INTERVALS;
  
  for (let t = 0; t < TRIALS; t++) {
    const r = runTrialFlowOptimised(p, rand, t);
    r.occ.forEach((v, i) => (occSum[i] += v));
    used += r.used;
    req1 += r.req[2]; req2 += r.req[4];
    rej1 += r.rej[2]; rej2 += r.rej[4];
    allResults = allResults.concat(r.results);
  }
  return {
    avgOcc: occSum.map((v) => v / TRIALS),
    utilisation: used / TRIALS / totalCapacity,
    soldSeatHours: used / TRIALS / 2,
    rej1Rate: req1 ? rej1 / req1 : 0,
    rej2Rate: req2 ? rej2 / req2 : 0,
    successRate: req1 + req2 ? 1 - (rej1 + rej2) / (req1 + req2) : 0,
    results: allResults,
  };
}

// ---------- Model 2: Utilisation optimised (no stream constraint) ----------
function runTrialUtilisationOptimised(p, rand, dayIndex = 0) {
  const { day, date } = bookingDay(dayIndex);
  const occ = new Array(INTERVALS).fill(0);
  const n = p.demand;
  
  // No 50/50 constraint - use full capacity for both streams
  const customers = [];
  for (let k = 0; k < n; k++) {
    customers.push({
      dur: rand() < p.twoHourShare / 100 ? 4 : 2,
      flexible: rand() < p.lastMinuteShare / 100,
    });
  }
  
  const planners = customers.filter((c) => !c.flexible);
  const flex = customers.filter((c) => c.flexible);
  shuffle(planners, rand);
  shuffle(flex, rand);
  const ordered = [...planners, ...flex];
  
  const weightsCache = {};
  const startsCache = { 2: validStarts(2, p.hourAlign), 4: validStarts(4, p.hourAlign) };
  const req = { 2: 0, 4: 0 };
  const rej = { 2: 0, 4: 0 };
  
  const results = [];
  
  for (const c of ordered) {
    req[c.dur]++;
    // Use full capacity for both durations (reserve applies to 1-hour bookings only, consistent with basic model)
    const cap = c.dur === 2 ? p.seats - p.reserve : p.seats;
    const maxStart = INTERVALS - c.dur;
    
    if (!weightsCache[c.dur]) weightsCache[c.dur] = prefWeights(maxStart, p.peakBias);
    const pref = sampleIdx(weightsCache[c.dur], rand);
    
    const feasible = (s) => {
      for (let i = s; i < s + c.dur; i++) if (occ[i] + 1 > cap) return false;
      return true;
    };
    
    let candidates;
    if (c.flexible) {
      candidates = startsCache[c.dur].filter(feasible);
    } else {
      candidates = startsCache[c.dur].filter((s) => Math.abs(s - pref) <= 1 && feasible(s));
    }
    
    if (candidates.length === 0) { rej[c.dur]++; 
      results.push({ day, date, duration: c.dur === 2 ? '1h' : '2h', flexible: c.flexible, accepted: false, startTime: null, model: 'Utilisation Optimised' });
      continue; }
    
    let pick;
    if (p.smart) {
      let best = -Infinity;
      for (const s of candidates) {
        let load = 0;
        for (let i = s; i < s + c.dur; i++) load += occ[i];
        const score = load * 100 - Math.abs(s - pref);
        if (score > best) { best = score; pick = s; }
      }
    } else {
      pick = candidates.reduce((a, s) => Math.abs(s - pref) < Math.abs(a - pref) ? s : a, candidates[0]);
    }
    
    for (let i = pick; i < pick + c.dur; i++) occ[i]++;
    results.push({ day, date, duration: c.dur === 2 ? '1h' : '2h', flexible: c.flexible, accepted: true, startTime: timeLabel(pick), model: 'Utilisation Optimised' });
  }
  
  const used = occ.reduce((a, c) => a + c, 0);
  return { occ, used, req, rej, results };
}

function simulateUtilisationOptimised(p, seed) {
  const rand = mulberry32(seed);
  const occSum = new Array(INTERVALS).fill(0);
  let used = 0, req1 = 0, req2 = 0, rej1 = 0, rej2 = 0;
  let allResults = [];
  for (let t = 0; t < TRIALS; t++) {
    const r = runTrialUtilisationOptimised(p, rand, t);
    r.occ.forEach((v, i) => (occSum[i] += v));
    used += r.used;
    req1 += r.req[2]; req2 += r.req[4];
    rej1 += r.rej[2]; rej2 += r.rej[4];
    allResults = allResults.concat(r.results);
  }
  return {
    avgOcc: occSum.map((v) => v / TRIALS),
    utilisation: used / TRIALS / (p.seats * INTERVALS),
    soldSeatHours: used / TRIALS / 2,
    rej1Rate: req1 ? rej1 / req1 : 0,
    rej2Rate: req2 ? rej2 / req2 : 0,
    successRate: req1 + req2 ? 1 - (rej1 + rej2) / (req1 + req2) : 0,
    results: allResults,
  };
}

// ---------- model B: advanced (index2.html) ----------
function runTrialAdv(p, rand) {
  const occ = new Array(INTERVALS).fill(0);
  const n = p.demand;
  const capBase = p.seats + p.overbook;
  const customers = [];
  for (let k = 0; k < n; k++) {
    customers.push({
      dur: rand() < p.twoHourShare / 100 ? 4 : 2,
      flexible: rand() < p.lastMinuteShare / 100,
    });
  }
  const planners = customers.filter((c) => !c.flexible);
  const flex = customers.filter((c) => c.flexible);
  shuffle(planners, rand);
  shuffle(flex, rand);
  const ordered = [...planners, ...flex];
  const earlyCount = planners.length;

  const cancelMap = new Map();
  const insideCutoff = [];
  const scheduleCancel = (k, s, dur) => {
    if (rand() < p.lateCancelShare / 100) { insideCutoff.push([s, dur]); return; }
    const at = k + 1 + Math.floor(rand() * (n - k));
    if (at >= n) { insideCutoff.push([s, dur]); return; }
    if (!cancelMap.has(at)) cancelMap.set(at, []);
    cancelMap.get(at).push([s, dur]);
  };
  const applyCancels = (k) => {
    const list = cancelMap.get(k);
    if (!list) return;
    for (const [s, dur] of list) for (let i = s; i < s + dur; i++) occ[i]--;
    cancelMap.delete(k);
  };

  const weightsCache = {};
  const startsCache = { 2: validStarts(2, p.hourAlign), 4: validStarts(4, p.hourAlign) };
  const req = { 2: 0, 4: 0 };
  const rej = { 2: 0, 4: 0 };
  let soldIntervals = 0;

  for (let k = 0; k < n; k++) {
    applyCancels(k);
    const c = ordered[k];
    const late = k >= earlyCount;
    req[c.dur]++;
    const reserveNow = c.dur === 2 && !(p.releaseReserve && late) ? p.reserve : 0;
    const cap = capBase - reserveNow;
    const maxStart = INTERVALS - c.dur;
    if (!weightsCache[c.dur]) weightsCache[c.dur] = prefWeights(maxStart, p.peakBias);
    const pref = sampleIdx(weightsCache[c.dur], rand);
    const feasible = (s) => {
      for (let i = s; i < s + c.dur; i++) if (occ[i] + 1 > cap) return false;
      return true;
    };
    let candidates;
    if (c.flexible) {
      candidates = startsCache[c.dur].filter(feasible);
    } else {
      const window = rand() < p.incentive / 100 ? 4 : 1;
      candidates = startsCache[c.dur].filter((s) => Math.abs(s - pref) <= window && feasible(s));
    }
    if (candidates.length === 0) { rej[c.dur]++; continue; }
    let pick;
    if (p.smart) {
      let best = -Infinity;
      for (const s of candidates) {
        let load = 0;
        for (let i = s; i < s + c.dur; i++) load += occ[i];
        const score = load * 100 - Math.abs(s - pref);
        if (score > best) { best = score; pick = s; }
      }
    } else {
      pick = candidates.reduce((a, s) => Math.abs(s - pref) < Math.abs(a - pref) ? s : a, candidates[0]);
    }
    for (let i = pick; i < pick + c.dur; i++) occ[i]++;
    soldIntervals += c.dur;
    if (rand() < p.cancelRate / 100) scheduleCancel(k, pick, c.dur);
  }

  for (const at of [...cancelMap.keys()]) applyCancels(at);
  let deadIntervals = 0;
  for (const [s, dur] of insideCutoff) {
    for (let i = s; i < s + dur; i++) occ[i]--;
    deadIntervals += dur;
  }

  let attended = 0, bumped = 0;
  for (const v of occ) {
    attended += Math.min(v, p.seats);
    bumped += Math.max(0, v - p.seats);
  }
  return { occ, attended, bumped, sold: soldIntervals, dead: deadIntervals, req, rej };
}

function simulateAdv(p, seed) {
  const rand = mulberry32(seed);
  const occSum = new Array(INTERVALS).fill(0);
  let attended = 0, bumped = 0, sold = 0, dead = 0, req1 = 0, req2 = 0, rej1 = 0, rej2 = 0;
  for (let t = 0; t < TRIALS; t++) {
    const r = runTrialAdv(p, rand);
    r.occ.forEach((v, i) => (occSum[i] += v));
    attended += r.attended; bumped += r.bumped; sold += r.sold; dead += r.dead;
    req1 += r.req[2]; req2 += r.req[4];
    rej1 += r.rej[2]; rej2 += r.rej[4];
  }
  return {
    avgOcc: occSum.map((v) => v / TRIALS),
    utilisation: attended / TRIALS / (p.seats * INTERVALS),
    filledSeatHours: attended / TRIALS / 2,
    paidSeatHours: (sold - bumped) / TRIALS / 2,
    deadSeatHours: dead / TRIALS / 2,
    bumpedSeatHours: bumped / TRIALS / 2,
    rej1Rate: req1 ? rej1 / req1 : 0,
    rej2Rate: req2 ? rej2 / req2 : 0,
  };
}

// ---------- ui ----------
const cellColour = (frac) => {
  const from = [228, 236, 233], to = [14, 91, 74];
  const f = Math.min(1, Math.max(0, frac));
  const c = from.map((v, i) => Math.round(v + (to[i] - v) * f));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
};

function Slider({ label, value, onChange, min, max, step = 1, unit = "" }) {
  return (
    <label className="ctl">
      <span className="ctl-row">
        <span>{label}</span>
        <input 
          type="number" 
          min={min} 
          max={max} 
          step={step} 
          value={value}
          onChange={(e) => onChange(Number(e.target.value))}
          className="mono val-input"
        />
        <span className="mono val-unit">{unit}</span>
      </span>
      <input type="range" min={min} max={max} step={step} value={value}
        onChange={(e) => onChange(Number(e.target.value))} />
    </label>
  );
}

function Toggle({ label, on, onChange, hint }) {
  return (
    <button className={`toggle ${on ? "on" : ""}`} onClick={() => onChange(!on)}
      aria-pressed={on} title={hint}>
      <span className="pip" />
      <span>{label}</span>
    </button>
  );
}

function Heatmap({ avgOcc, seats }) {
  return (
    <>
      <div className="ledger">
        {avgOcc.map((v, i) => {
          const f = v / seats;
          return (
            <div key={i} className="cell mono"
              style={{ background: cellColour(f), color: f > 0.55 ? "#fff" : "#172422" }}>
              {Math.round(v)}
            </div>
          );
        })}
      </div>
      <div className="axis mono">
        {Array.from({ length: INTERVALS }, (_, i) => (
          <span key={i}>{i % 2 === 0 ? timeLabel(i).replace(":00", "") : ""}</span>
        ))}
      </div>
    </>
  );
}

function Delta({ a, b, higherIsBetter = true, fmt = (v) => v.toFixed(1) }) {
  const diff = b - a;
  if (Math.abs(diff) < 1e-9) return <span className="delta flat">no change</span>;
  const good = higherIsBetter ? diff > 0 : diff < 0;
  return (
    <span className={`delta ${good ? "up" : "down"}`}>
      {diff > 0 ? "+" : ""}{fmt(diff)}
    </span>
  );
}

function App() {
  // shared params (both models)
  const [seats, setSeats] = useState(30);
  const [demand, setDemand] = useState(280);
  const [twoHourShare, setTwoHourShare] = useState(5);
  const [peakBias, setPeakBias] = useState(50);
  const [lastMinuteShare, setLastMinuteShare] = useState(40);
  const [hourAlign, setHourAlign] = useState(true);
  const [smart, setSmart] = useState(true);
  const [reserve, setReserve] = useState(0);

  const [seed, setSeed] = useState(1);

  const shared = { seats, demand, twoHourShare, peakBias, lastMinuteShare, hourAlign, smart, reserve };

  const model1 = useMemo(() => simulateFlowOptimised(shared, seed), [
    seats, demand, twoHourShare, peakBias, lastMinuteShare, hourAlign, smart, reserve, seed,
  ]);
  const model2 = useMemo(() => simulateUtilisationOptimised(shared, seed), [
    seats, demand, twoHourShare, peakBias, lastMinuteShare, hourAlign, smart, reserve, seed,
  ]);

  const pct = (v) => (v * 100).toFixed(1) + "%";
  const pctPts = (v) => (v * 100).toFixed(1) + "pp";

  // Combine results from both models across two weeks of trading days
  const allResults = useMemo(() => {
    const rand = mulberry32(seed);
    const out = [];
    for (let d = 0; d < SAMPLE_DAYS; d++) {
      out.push(...runTrialFlowOptimised(shared, rand, d).results);
      out.push(...runTrialUtilisationOptimised(shared, rand, d).results);
    }
    return out;
  }, [shared, seed]);

  // Preview a few rows per model per day so the table spans the whole fortnight
  const previewRows = useMemo(() => {
    const perGroup = {};
    return allResults.filter((r) => {
      const key = `${r.date}|${r.model}`;
      perGroup[key] = (perGroup[key] || 0) + 1;
      return perGroup[key] <= SAMPLE_PREVIEW_PER_DAY;
    });
  }, [allResults]);

  // Convert results to CSV
  const downloadCSV = () => {
    const headers = ['Model', 'Day', 'Date', 'Duration', 'Flexible', 'Accepted', 'Start Time'];
    const rows = allResults.map(r => [
      r.model,
      r.day,
      r.date,
      r.duration,
      r.flexible ? 'Yes' : 'No',
      r.accepted ? 'Yes' : 'No',
      r.startTime || 'N/A'
    ]);
    
    const csvContent = [
      headers.join(','),
      ...rows.map(row => row.join(','))
    ].join('\n');
    
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    const url = URL.createObjectURL(blob);
    link.setAttribute('href', url);
    link.setAttribute('download', `booking-simulation-${seed}.csv`);
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  return (
    <div className="wrap">
      <style>{`
        * { box-sizing: border-box; margin: 0; }
        .wrap {
          min-height: 100vh; background: #EEF1F0; color: #172422;
          font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
          padding: 28px 20px 48px; font-size: 14px;
        }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
        header { max-width: 1320px; margin: 0 auto 22px; }
        h1 { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
        .sub { color: #6C7A77; margin-top: 4px; max-width: 72ch; }
        .grid { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: 300px 1fr 1fr; gap: 18px; align-items: start; }
        @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
        .panel { background: #fff; border: 1px solid #D8DFDD; border-radius: 10px; padding: 18px; }
        .panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #6C7A77; margin-bottom: 12px; font-weight: 600; }
        .ctl { display: block; margin-bottom: 14px; }
        .ctl-row { display: flex; justify-content: space-between; margin-bottom: 4px; align-items: center; }
        .val { color: #0E5B4A; font-weight: 600; }
        .val-input { 
          width: 60px; 
          padding: 4px 8px; 
          border: 1px solid #D8DFDD; 
          border-radius: 4px; 
          color: #0E5B4A; 
          font-weight: 600; 
          font-size: 14px;
          text-align: right;
        }
        .val-input:focus { 
          outline: 2px solid #0E5B4A; 
          outline-offset: 1px;
          border-color: #0E5B4A;
        }
        .val-unit { color: #0E5B4A; font-weight: 600; margin-left: 4px; }
        input[type=range] { width: 100%; accent-color: #0E5B4A; }
        .toggles { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; margin-bottom: 14px; }
        .toggle { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border: 1px solid #D8DFDD;
          border-radius: 8px; background: #fff; cursor: pointer; font: inherit; color: inherit; text-align: left; }
        .toggle:focus-visible { outline: 2px solid #0E5B4A; outline-offset: 1px; }
        .toggle .pip { width: 10px; height: 10px; border-radius: 50%; background: #D8DFDD; flex: none; }
        .toggle.on { border-color: #0E5B4A; background: #F2F7F5; }
        .toggle.on .pip { background: #0E5B4A; }
        .reroll { margin-top: 6px; width: 100%; padding: 9px; border-radius: 8px; border: 1px solid #172422;
          background: #172422; color: #fff; font: inherit; cursor: pointer; }
        .colhead { display: flex; align-items: center; justify-content: space-between; max-width: 1320px; margin: 0 auto; }
        .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700;
          text-transform: uppercase; letter-spacing: 0.06em; }
        .badge.basic { background: #E7ECEA; color: #45524F; }
        .badge.flow { background: #E7ECEA; color: #45524F; }
        .badge.util { background: #0E5B4A; color: #fff; }
        .colnote { color: #6C7A77; font-size: 12px; margin-top: 4px; margin-bottom: 12px; max-width: 55ch; }
        .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
        .metric { background: #F7F9F8; border: 1px solid #E3E9E7; border-radius: 8px; padding: 10px 12px; }
        .metric .k { font-size: 10px; text-transform: uppercase; letter-spacing: 0.07em; color: #6C7A77; font-weight: 600; }
        .metric .v { font-size: 22px; font-weight: 650; margin-top: 2px; letter-spacing: -0.02em; }
        .metric .d { margin-top: 2px; }
        .delta { font-size: 12px; font-weight: 600; }
        .delta.up { color: #0E5B4A; }
        .delta.down { color: #B5432B; }
        .delta.flat { color: #9AA6A3; }
        .ledger { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; margin: 10px 0 4px; }
        .cell { border-radius: 4px; aspect-ratio: 1 / 1.5; display: flex; align-items: flex-end;
          justify-content: center; padding-bottom: 6px; font-size: 11px; font-weight: 600; }
        .axis { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; color: #6C7A77; font-size: 10px; }
        .axis span { text-align: center; }
        .note { color: #6C7A77; font-size: 12px; margin-top: 14px; line-height: 1.5; }
        .divider { height: 1px; background: #D8DFDD; margin: 16px 0; }
        .download-btn { 
          padding: 8px 16px; 
          border-radius: 6px; 
          border: 1px solid #0E5B4A; 
          background: #0E5B4A; 
          color: #fff; 
          font: inherit; 
          cursor: pointer; 
          font-size: 13px;
          font-weight: 500;
        }
        .download-btn:hover { background: #0a4a3c; }
        .download-btn:focus-visible { outline: 2px solid #0E5B4A; outline-offset: 1px; }
      `}</style>

      <header>
        <h1>Simulator comparison: Flow optimised vs Utilisation optimised</h1>
        <p className="sub">
          Same demand scenario run through both booking models side by side. Model 1 uses a 50/50 stream constraint
          (separate fixed cohorts for hour and half-hour bookings), while Model 2 has no stream constraint and maximises
          utilisation based on available capacity. This comparison shows whether allowing the mix to flex produces
          materially better utilisation and fewer rejected bookings.
        </p>
      </header>

      <div className="grid">
        <div className="panel">
          <h2>Shared demand scenario</h2>
          <Slider label="Seats" value={seats} onChange={setSeats} min={10} max={60} />
          <Slider label="Booking attempts / day" value={demand} onChange={setDemand} min={50} max={10000} step={10} />
          <Slider label="2-hour share of requests" value={twoHourShare} onChange={setTwoHourShare} min={0} max={100} unit="%" />
          <Slider label="Peak-time bias" value={peakBias} onChange={setPeakBias} min={0} max={100} unit="%" />
          <Slider label="Last-minute share" value={lastMinuteShare} onChange={setLastMinuteShare} min={0} max={100} unit="%" />

          <h2 style={{ marginTop: 18 }}>Shared packing policy</h2>
          <div className="toggles">
            <Toggle label="2h slots start on the hour" on={hourAlign} onChange={setHourAlign}
              hint="Restricts 2-hour bookings to 9:00, 10:00, 11:00…" />
            <Toggle label="Smart placement" on={smart} onChange={setSmart}
              hint="Flexible customers are steered into already-busy intervals to limit fragmentation" />
          </div>
          <Slider label="Seats reserved for 2h bookings" value={reserve} onChange={setReserve} min={0} max={10} />

          <button className="reroll" onClick={() => setSeed((s) => s + 1)}>Re-run with new randomness</button>
        </div>

        <div>
          <div className="colhead"><span className="badge flow">Model 1: Flow optimised</span></div>
          <p className="colnote">Separate fixed cohorts for hour and half-hour bookings. Each stream has a maximum intake of 50% of available capacity. Combined theoretical ceiling of 100%.</p>
          <div className="panel">
            <div className="metrics">
              <div className="metric">
                <div className="k">Booking success rate</div>
                <div className="v mono">{pct(model1.successRate)}</div>
              </div>
              <div className="metric">
                <div className="k">Utilisation</div>
                <div className="v mono">{pct(model1.utilisation)}</div>
              </div>
              <div className="metric">
                <div className="k">Sold seat-hours</div>
                <div className="v mono">{model1.soldSeatHours.toFixed(0)}</div>
              </div>
              <div className="metric">
                <div className="k">1h rejections</div>
                <div className="v mono" style={{ color: model1.rej1Rate > 0.02 ? "#B5432B" : "#172422" }}>{pct(model1.rej1Rate)}</div>
              </div>
              <div className="metric">
                <div className="k">2h rejections</div>
                <div className="v mono" style={{ color: model1.rej2Rate > 0.02 ? "#B5432B" : "#172422" }}>{pct(model1.rej2Rate)}</div>
              </div>
            </div>
            <h2>Average seats occupied per half hour</h2>
            <Heatmap avgOcc={model1.avgOcc} seats={seats} />
          </div>
        </div>

        <div>
          <div className="colhead"><span className="badge util">Model 2: Utilisation optimised</span></div>
          <p className="colnote">No 50/50 stream constraint. Bookings are accepted based on available capacity and the algorithm tries to maximise utilisation. The hour/half-hour mix can flex based on demand.</p>
          <div className="panel">
            <div className="metrics">
              <div className="metric">
                <div className="k">Booking success rate</div>
                <div className="v mono">{pct(model2.successRate)}</div>
                <div className="d"><Delta a={model1.successRate} b={model2.successRate} fmt={pctPts} /></div>
              </div>
              <div className="metric">
                <div className="k">Utilisation</div>
                <div className="v mono">{pct(model2.utilisation)}</div>
                <div className="d"><Delta a={model1.utilisation} b={model2.utilisation} fmt={pctPts} /></div>
              </div>
              <div className="metric">
                <div className="k">Sold seat-hours</div>
                <div className="v mono">{model2.soldSeatHours.toFixed(0)}</div>
                <div className="d"><Delta a={model1.soldSeatHours} b={model2.soldSeatHours} fmt={(v) => v.toFixed(0)} /></div>
              </div>
              <div className="metric">
                <div className="k">1h rejections</div>
                <div className="v mono" style={{ color: model2.rej1Rate > 0.02 ? "#B5432B" : "#172422" }}>{pct(model2.rej1Rate)}</div>
                <div className="d"><Delta a={model1.rej1Rate} b={model2.rej1Rate} higherIsBetter={false} fmt={pctPts} /></div>
              </div>
              <div className="metric">
                <div className="k">2h rejections</div>
                <div className="v mono" style={{ color: model2.rej2Rate > 0.02 ? "#B5432B" : "#172422" }}>{pct(model2.rej2Rate)}</div>
                <div className="d"><Delta a={model1.rej2Rate} b={model2.rej2Rate} higherIsBetter={false} fmt={pctPts} /></div>
              </div>
            </div>
            <h2>Average seats occupied per half hour</h2>
            <Heatmap avgOcc={model2.avgOcc} seats={seats} />
          </div>
        </div>
      </div>

      <div style={{ maxWidth: 1320, margin: "18px auto 0" }}>
        <p className="note">
          Booking success rate is the customer-side efficiency measure: accepted requests as a share of
          all requests made, across both durations. Deltas are Model 2 minus Model 1, coloured green when the change is favourable
          (higher success rate, higher utilisation, fewer rejections) and orange when unfavourable. Because both columns
          share one random seed and the same demand/policy inputs, any difference you see comes purely
          from the different capacity allocation strategies — the 50/50 stream constraint vs flexible utilisation.
        </p>
      </div>

      <div style={{ maxWidth: 1320, margin: "18px auto 0" }}>
        <div className="panel">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <h2>Sample data ({allResults.length.toLocaleString()} bookings over {SAMPLE_DAYS} trading days)</h2>
            <button className="download-btn" onClick={downloadCSV}>Download CSV</button>
          </div>
          <div style={{ maxHeight: 300, overflow: "auto", border: "1px solid #D8DFDD", borderRadius: 8 }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
              <thead style={{ position: "sticky", top: 0, background: "#F7F9F8" }}>
                <tr>
                  <th style={{ padding: "8px 12px", textAlign: "left", borderBottom: "1px solid #D8DFDD", fontWeight: 600, color: "#6C7A77" }}>Model</th>
                  <th style={{ padding: "8px 12px", textAlign: "left", borderBottom: "1px solid #D8DFDD", fontWeight: 600, color: "#6C7A77" }}>Day</th>
                  <th style={{ padding: "8px 12px", textAlign: "left", borderBottom: "1px solid #D8DFDD", fontWeight: 600, color: "#6C7A77" }}>Date</th>
                  <th style={{ padding: "8px 12px", textAlign: "left", borderBottom: "1px solid #D8DFDD", fontWeight: 600, color: "#6C7A77" }}>Duration</th>
                  <th style={{ padding: "8px 12px", textAlign: "left", borderBottom: "1px solid #D8DFDD", fontWeight: 600, color: "#6C7A77" }}>Flexible</th>
                  <th style={{ padding: "8px 12px", textAlign: "left", borderBottom: "1px solid #D8DFDD", fontWeight: 600, color: "#6C7A77" }}>Accepted</th>
                  <th style={{ padding: "8px 12px", textAlign: "left", borderBottom: "1px solid #D8DFDD", fontWeight: 600, color: "#6C7A77" }}>Start Time</th>
                </tr>
              </thead>
              <tbody>
                {previewRows.map((r, i) => (
                  <tr key={i} style={{ borderBottom: "1px solid #E3E9E7" }}>
                    <td style={{ padding: "8px 12px", color: r.model === 'Flow Optimised' ? "#45524F" : "#0E5B4A" }}>{r.model}</td>
                    <td style={{ padding: "8px 12px" }}>{r.day}</td>
                    <td style={{ padding: "8px 12px", fontFamily: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" }}>{r.date}</td>
                    <td style={{ padding: "8px 12px" }}>{r.duration}</td>
                    <td style={{ padding: "8px 12px" }}>{r.flexible ? 'Yes' : 'No'}</td>
                    <td style={{ padding: "8px 12px", color: r.accepted ? "#0E5B4A" : "#B5432B" }}>{r.accepted ? 'Yes' : 'No'}</td>
                    <td style={{ padding: "8px 12px", fontFamily: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" }}>{r.startTime || 'N/A'}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            {allResults.length > previewRows.length && (
              <p style={{ padding: "12px", color: "#6C7A77", fontSize: 12, textAlign: "center", margin: 0 }}>
                Showing the first {SAMPLE_PREVIEW_PER_DAY} bookings per model per day ({previewRows.length.toLocaleString()} of {allResults.length.toLocaleString()}). Download CSV for full dataset.
              </p>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
