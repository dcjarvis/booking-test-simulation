// Each trial represents one trading day; dayIndex 0 is the next business day.
function bookingDay(dayIndex) {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + 1);
  let remaining = dayIndex;
  for (;;) {
    const isWeekday = d.getDay() !== 0 && d.getDay() !== 6;
    if (isWeekday) {
      if (remaining === 0) break;
      remaining--;
    }
    d.setDate(d.getDate() + 1);
  }
  const pad = (v) => String(v).padStart(2, "0");
  return {
    day: DAY_NAMES[d.getDay()],
    date: `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`,
  };
}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(arr, rand) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function prefWeights(maxStart, peakBias) {
  const b = peakBias / 100;
  const w = [];
  for (let i = 0; i <= maxStart; i++) {
    const peaks = Math.exp(-((i - 3) ** 2) / 6) + 0.8 * Math.exp(-((i - 10) ** 2) / 6);
    w.push((1 - b) * 1 + b * 2.2 * peaks);
  }
  return w;
}

function sampleIdxFrom(weights, roll) {
  const total = weights.reduce((a, c) => a + c, 0);
  let r = roll * total;
  for (let i = 0; i < weights.length; i++) {
    r -= weights[i];
    if (r <= 0) return i;
  }
  return weights.length - 1;
}

function sampleIdx(weights, rand) {
  return sampleIdxFrom(weights, rand());
}

// One day of demand, generated once and handed to every model so they face exactly the same
// customers in the same order. Every random choice a customer makes (length, flexibility, preferred
// time, whether they cancel and rebook) is drawn here, so a model that rejects or cancels more often
// cannot pull the two simulations out of step. The spare customers back any rebooking a model triggers.
function buildDemand(p, seed) {
  const rand = mulberry32(seed);
  const customers = [];
  for (let k = 0; k < p.demand * 2; k++) {
    customers.push({
      dur: rand() < p.twoHourShare / 100 ? 4 : 2,
      flexible: rand() < p.lastMinuteShare / 100,
      prefRoll: rand(),
      cancelRoll: rand(),
      whenRoll: rand(),
      rebookRoll: rand(),
    });
  }
  const today = customers.slice(0, p.demand);
  const planners = today.filter((c) => !c.flexible);
  const flex = today.filter((c) => c.flexible);
  shuffle(planners, rand);
  shuffle(flex, rand);
  return { ordered: [...planners, ...flex], spare: customers.slice(p.demand) };
}

function demandSeed(seed, dayIndex) {
  return (seed * 7919 + dayIndex) | 0;
}

function validStarts(dur, hourAlign) {
  const out = [];
  for (let s = 0; s <= INTERVALS - dur; s++) {
    if (dur === 4 && hourAlign && s % 2 !== 0) continue;
    out.push(s);
  }
  return out;
}

// Walk the day forwards and seat people as they arrive. Overbooking can sell more places than the
// room holds, so an arrival that finds every seat taken is turned away and loses its whole booking.
// A booking only ever needs checking at its start: later arrivals test the seat count again.
function attendance(bookings, p) {
  const seated = new Array(INTERVALS).fill(0);
  let turnedAway = 0, turnedAwaySeatHours = 0;
  for (const b of [...bookings].sort((a, b2) => a.start - b2.start)) {
    if (!b.live) continue;
    if (seated[b.start] >= p.seats) {
      turnedAway++;
      turnedAwaySeatHours += b.dur;
      b.row.outcome = 'Turned away';
      continue;
    }
    for (let i = b.start; i < b.start + b.dur; i++) seated[i]++;
    b.row.outcome = 'Attended';
  }
  return { seatedOcc: seated, used: seated.reduce((a, v) => a + v, 0), turnedAway, turnedAwaySeatHours };
}

// Cancellations hand the seat back part-way through the booking window, so later customers can take
// it; a share of the customers who cancel come back with a fresh request of their own
class CancelBook {
  constructor(p, spare) {
    this.p = p;
    this.spare = spare;
    this.taken = 0;
    this.due = new Map();
    this.late = [];
    this.count = 0;
  }

  maybeCancel(k, c, booking, queue) {
    if (c.cancelRoll >= this.p.cancelRate / 100) return;
    this.count++;
    const horizon = queue.length;
    const at = k + 1 + Math.floor(c.whenRoll * Math.max(1, horizon - k));
    if (at < horizon) {
      if (!this.due.has(at)) this.due.set(at, []);
      this.due.get(at).push(booking);
    } else {
      this.late.push(booking);
    }
    const replacement = this.spare[this.taken];
    if (c.rebookRoll < this.p.rebookShare / 100 && replacement) {
      this.taken++;
      queue.push({ ...replacement, dur: c.dur, flexible: c.flexible });
    }
  }

  release(b) {
    b.live = false;
    b.row.outcome = 'Cancelled';
    for (let i = b.start; i < b.start + b.dur; i++) b.pool[i]--;
  }

  releaseDue(k) {
    const list = this.due.get(k);
    if (!list) return;
    for (const b of list) this.release(b);
    this.due.delete(k);
  }

  // seats freed too late for anyone else to take them still empty out on the day
  releaseRemaining() {
    for (const k of [...this.due.keys()]) this.releaseDue(k);
    for (const b of this.late) this.release(b);
    this.late = [];
  }
}

// ---------- model A: basic (index.html) ----------
function runTrialBasic(p, rand) {
  const occ = new Array(INTERVALS).fill(0);
  const n = p.demand;
  const customers = [];
  for (let k = 0; k < n; k++) {
    customers.push({
      dur: rand() < p.twoHourShare / 100 ? 4 : 2,
      flexible: rand() < p.lastMinuteShare / 100,
    });
  }
  const planners = customers.filter((c) => !c.flexible);
  const flex = customers.filter((c) => c.flexible);
  shuffle(planners, rand);
  shuffle(flex, rand);
  const ordered = [...planners, ...flex];
  const weightsCache = {};
  const startsCache = { 2: validStarts(2, p.hourAlign), 4: validStarts(4, p.hourAlign) };
  const req = { 2: 0, 4: 0 };
  const rej = { 2: 0, 4: 0 };
  for (const c of ordered) {
    req[c.dur]++;
    const cap = c.dur === 2 ? p.seats - p.reserve : p.seats;
    const maxStart = INTERVALS - c.dur;
    if (!weightsCache[c.dur]) weightsCache[c.dur] = prefWeights(maxStart, p.peakBias);
    const pref = sampleIdx(weightsCache[c.dur], rand);
    const feasible = (s) => {
      for (let i = s; i < s + c.dur; i++) if (occ[i] + 1 > cap) return false;
      return true;
    };
    let candidates;
    if (c.flexible) {
      candidates = startsCache[c.dur].filter(feasible);
    } else {
      candidates = startsCache[c.dur].filter((s) => Math.abs(s - pref) <= 1 && feasible(s));
    }
    if (candidates.length === 0) { rej[c.dur]++; continue; }
    let pick;
    if (p.smart) {
      let best = -Infinity;
      for (const s of candidates) {
        let load = 0;
        for (let i = s; i < s + c.dur; i++) load += occ[i];
        const score = load * 100 - Math.abs(s - pref);
        if (score > best) { best = score; pick = s; }
      }
    } else {
      pick = candidates.reduce((a, s) => Math.abs(s - pref) < Math.abs(a - pref) ? s : a, candidates[0]);
    }
    for (let i = pick; i < pick + c.dur; i++) occ[i]++;
  }
  const used = occ.reduce((a, c) => a + c, 0);
  return { occ, used, req, rej };
}

function simulateBasic(p, seed) {
  const rand = mulberry32(seed);
  const occSum = new Array(INTERVALS).fill(0);
  let used = 0, req1 = 0, req2 = 0, rej1 = 0, rej2 = 0;
  for (let t = 0; t < TRIALS; t++) {
    const r = runTrialBasic(p, rand);
    r.occ.forEach((v, i) => (occSum[i] += v));
    used += r.used;
    req1 += r.req[2]; req2 += r.req[4];
    rej1 += r.rej[2]; rej2 += r.rej[4];
  }
  return {
    avgOcc: occSum.map((v) => v / TRIALS),
    utilisation: used / TRIALS / (p.seats * INTERVALS),
    soldSeatHours: used / TRIALS / 2,
    rej1Rate: req1 ? rej1 / req1 : 0,
    rej2Rate: req2 ? rej2 / req2 : 0,
  };
}

// ---------- Model 1: Flow optimised (50/50 stream constraint) ----------
function runTrialFlowOptimised(p, demand, dayIndex = 0) {
  const { day, date } = bookingDay(dayIndex);
  // Streams are start times, not durations: one cohort starts on the hour, the other at :30.
  // Each cohort has its own seats, so occupancy is tracked per cohort.
  const occOnHour = new Array(INTERVALS).fill(0);
  const occOnHalf = new Array(INTERVALS).fill(0);
  
  // Separate capacity into two streams (handle odd seat counts), including any overbooking allowance
  const capBase = p.seats + p.overbook;
  const hourStartCap = Math.ceil(capBase * 0.5); // 50% for bookings starting on the hour (round up)
  const halfStartCap = capBase - hourStartCap; // Remaining for bookings starting at :30
  
  const ordered = [...demand.ordered];
  
  const weightsCache = {};
  const startsCache = { 2: validStarts(2, p.hourAlign), 4: validStarts(4, p.hourAlign) };
  const req = { 2: 0, 4: 0 };
  const rej = { 2: 0, 4: 0 };
  const cancels = new CancelBook(p, demand.spare);
  
  const results = [];
  const booked = [];
  
  for (let k = 0; k < ordered.length; k++) {
    cancels.releaseDue(k);
    const c = ordered[k];
    req[c.dur]++;
    // A booking draws on the cohort matching its start time, for its whole length
    // (reserve applies to 1-hour bookings only)
    const poolOf = (s) => (s % 2 === 0 ? occOnHour : occOnHalf);
    const capOf = (s) => (s % 2 === 0 ? hourStartCap : halfStartCap) - (c.dur === 2 ? p.reserve : 0);
    const maxStart = INTERVALS - c.dur;
    
    if (!weightsCache[c.dur]) weightsCache[c.dur] = prefWeights(maxStart, p.peakBias);
    const pref = sampleIdxFrom(weightsCache[c.dur], c.prefRoll);
    
    const feasible = (s) => {
      const occ = poolOf(s), cap = capOf(s);
      for (let i = s; i < s + c.dur; i++) if (occ[i] + 1 > cap) return false;
      return true;
    };
    
    let candidates;
    if (c.flexible) {
      candidates = startsCache[c.dur].filter(feasible);
    } else {
      candidates = startsCache[c.dur].filter((s) => Math.abs(s - pref) <= 1 && feasible(s));
    }
    
    if (candidates.length === 0) { rej[c.dur]++; 
      results.push({ day, date, duration: c.dur === 2 ? '1h' : '2h', flexible: c.flexible, accepted: false, outcome: 'Rejected', startTime: null, model: 'Flow Optimised' });
      continue; }
    
    let pick;
    // people who named a time always take the nearest slot they can get; smart packing only moves
    // customers who said they don't mind when they come
    if (p.smart && c.flexible) {
      let best = -Infinity;
      for (const s of candidates) {
        const occ = poolOf(s);
        let load = 0;
        for (let i = s; i < s + c.dur; i++) load += occ[i];
        const score = load * 100 - Math.abs(s - pref);
        if (score > best) { best = score; pick = s; }
      }
    } else {
      pick = candidates.reduce((a, s) => Math.abs(s - pref) < Math.abs(a - pref) ? s : a, candidates[0]);
    }
    
    const picked = poolOf(pick);
    for (let i = pick; i < pick + c.dur; i++) picked[i]++;

    const row = { day, date, duration: c.dur === 2 ? '1h' : '2h', flexible: c.flexible, accepted: true, outcome: 'Attended', startTime: timeLabel(pick), model: 'Flow Optimised' };
    results.push(row);
    const booking = { pool: picked, start: pick, dur: c.dur, row, live: true };
    booked.push(booking);
    cancels.maybeCancel(k, c, booking, ordered);
  }
  
  cancels.releaseRemaining();
  const occ = occOnHour.map((v, i) => v + occOnHalf[i]);
  return { occ, ...attendance(booked, p), cancelled: cancels.count, req, rej, results };
}

function simulateFlowOptimised(p, seed) {
  const occSum = new Array(INTERVALS).fill(0);
  let used = 0, turnedAway = 0, turnedAwayHours = 0, cancelled = 0, seated = 0, req1 = 0, req2 = 0, rej1 = 0, rej2 = 0;
  let allResults = [];
  const totalCapacity = p.seats * INTERVALS;
  
  for (let t = 0; t < TRIALS; t++) {
    const r = runTrialFlowOptimised(p, buildDemand(p, demandSeed(seed, t)), t);
    r.occ.forEach((v, i) => (occSum[i] += v));
    used += r.used; turnedAway += r.turnedAway; turnedAwayHours += r.turnedAwaySeatHours; cancelled += r.cancelled;
    seated += r.results.filter((x) => x.outcome === 'Attended').length;
    req1 += r.req[2]; req2 += r.req[4];
    rej1 += r.rej[2]; rej2 += r.rej[4];
    allResults = allResults.concat(r.results);
  }
  return {
    avgOcc: occSum.map((v) => v / TRIALS),
    utilisation: used / TRIALS / totalCapacity,
    soldSeatHours: used / TRIALS / 2,
    turnedAway: turnedAway / TRIALS,
    turnedAwayRate: turnedAway + seated ? turnedAway / (turnedAway + seated) : 0,
    turnedAwaySeatHours: turnedAwayHours / TRIALS / 2,
    cancellations: cancelled / TRIALS,
    rej1Rate: req1 ? rej1 / req1 : 0,
    rej2Rate: req2 ? rej2 / req2 : 0,
    successRate: req1 + req2 ? 1 - (rej1 + rej2) / (req1 + req2) : 0,
    results: allResults,
  };
}

// ---------- Model 2: Utilisation optimised (no stream constraint) ----------
function runTrialUtilisationOptimised(p, demand, dayIndex = 0) {
  const { day, date } = bookingDay(dayIndex);
  const occ = new Array(INTERVALS).fill(0);
  const capBase = p.seats + p.overbook;
  
  // No 50/50 constraint - use full capacity for both streams
  const ordered = [...demand.ordered];
  
  const weightsCache = {};
  const startsCache = { 2: validStarts(2, p.hourAlign), 4: validStarts(4, p.hourAlign) };
  const req = { 2: 0, 4: 0 };
  const rej = { 2: 0, 4: 0 };
  const cancels = new CancelBook(p, demand.spare);
  
  const results = [];
  const booked = [];
  
  for (let k = 0; k < ordered.length; k++) {
    cancels.releaseDue(k);
    const c = ordered[k];
    req[c.dur]++;
    // Use full capacity for both durations (reserve applies to 1-hour bookings only, consistent with basic model)
    const cap = c.dur === 2 ? capBase - p.reserve : capBase;
    const maxStart = INTERVALS - c.dur;
    
    if (!weightsCache[c.dur]) weightsCache[c.dur] = prefWeights(maxStart, p.peakBias);
    const pref = sampleIdxFrom(weightsCache[c.dur], c.prefRoll);
    
    const feasible = (s) => {
      for (let i = s; i < s + c.dur; i++) if (occ[i] + 1 > cap) return false;
      return true;
    };
    
    let candidates;
    if (c.flexible) {
      candidates = startsCache[c.dur].filter(feasible);
    } else {
      candidates = startsCache[c.dur].filter((s) => Math.abs(s - pref) <= 1 && feasible(s));
    }
    
    if (candidates.length === 0) { rej[c.dur]++; 
      results.push({ day, date, duration: c.dur === 2 ? '1h' : '2h', flexible: c.flexible, accepted: false, outcome: 'Rejected', startTime: null, model: 'Utilisation Optimised' });
      continue; }
    
    let pick;
    // people who named a time always take the nearest slot they can get; smart packing only moves
    // customers who said they don't mind when they come
    if (p.smart && c.flexible) {
      let best = -Infinity;
      for (const s of candidates) {
        let load = 0;
        for (let i = s; i < s + c.dur; i++) load += occ[i];
        const score = load * 100 - Math.abs(s - pref);
        if (score > best) { best = score; pick = s; }
      }
    } else {
      pick = candidates.reduce((a, s) => Math.abs(s - pref) < Math.abs(a - pref) ? s : a, candidates[0]);
    }
    
    for (let i = pick; i < pick + c.dur; i++) occ[i]++;

    const row = { day, date, duration: c.dur === 2 ? '1h' : '2h', flexible: c.flexible, accepted: true, outcome: 'Attended', startTime: timeLabel(pick), model: 'Utilisation Optimised' };
    results.push(row);
    const booking = { pool: occ, start: pick, dur: c.dur, row, live: true };
    booked.push(booking);
    cancels.maybeCancel(k, c, booking, ordered);
  }
  
  cancels.releaseRemaining();
  return { occ, ...attendance(booked, p), cancelled: cancels.count, req, rej, results };
}

function simulateUtilisationOptimised(p, seed) {
  const occSum = new Array(INTERVALS).fill(0);
  let used = 0, turnedAway = 0, turnedAwayHours = 0, cancelled = 0, seated = 0, req1 = 0, req2 = 0, rej1 = 0, rej2 = 0;
  let allResults = [];
  for (let t = 0; t < TRIALS; t++) {
    const r = runTrialUtilisationOptimised(p, buildDemand(p, demandSeed(seed, t)), t);
    r.occ.forEach((v, i) => (occSum[i] += v));
    used += r.used; turnedAway += r.turnedAway; turnedAwayHours += r.turnedAwaySeatHours; cancelled += r.cancelled;
    seated += r.results.filter((x) => x.outcome === 'Attended').length;
    req1 += r.req[2]; req2 += r.req[4];
    rej1 += r.rej[2]; rej2 += r.rej[4];
    allResults = allResults.concat(r.results);
  }
  return {
    avgOcc: occSum.map((v) => v / TRIALS),
    utilisation: used / TRIALS / (p.seats * INTERVALS),
    soldSeatHours: used / TRIALS / 2,
    turnedAway: turnedAway / TRIALS,
    turnedAwayRate: turnedAway + seated ? turnedAway / (turnedAway + seated) : 0,
    turnedAwaySeatHours: turnedAwayHours / TRIALS / 2,
    cancellations: cancelled / TRIALS,
    rej1Rate: req1 ? rej1 / req1 : 0,
    rej2Rate: req2 ? rej2 / req2 : 0,
    successRate: req1 + req2 ? 1 - (rej1 + rej2) / (req1 + req2) : 0,
    results: allResults,
  };
}

// ---------- Model 3: Flex optimised (50% peak intake per stream, flexes to full capacity) ----------
// Each start-time stream is sized for a peak intake of 50% of capacity, exactly as Model 1. The
// difference is that the split is a target rather than a wall: a customer who cannot be placed
// inside its own stream's half may borrow whatever the other stream is not using, up to the full
// capacity of the room. So the day keeps Model 1's tidy shape while demand is balanced, and behaves
// like Model 2 once one stream runs hot.
function runTrialFlexOptimised(p, demand, dayIndex = 0) {
  const { day, date } = bookingDay(dayIndex);
  const occOnHour = new Array(INTERVALS).fill(0);
  const occOnHalf = new Array(INTERVALS).fill(0);

  const capBase = p.seats + p.overbook;
  const hourStartCap = Math.ceil(capBase * 0.5);
  const halfStartCap = capBase - hourStartCap;

  const ordered = [...demand.ordered];

  const weightsCache = {};
  const startsCache = { 2: validStarts(2, p.hourAlign), 4: validStarts(4, p.hourAlign) };
  const req = { 2: 0, 4: 0 };
  const rej = { 2: 0, 4: 0 };
  const cancels = new CancelBook(p, demand.spare);

  const results = [];
  const booked = [];
  let flexed = 0;

  for (let k = 0; k < ordered.length; k++) {
    cancels.releaseDue(k);
    const c = ordered[k];
    req[c.dur]++;
    const poolOf = (s) => (s % 2 === 0 ? occOnHour : occOnHalf);
    const otherOf = (s) => (s % 2 === 0 ? occOnHalf : occOnHour);
    const reserveNow = c.dur === 2 ? p.reserve : 0;
    const streamCap = (s) => (s % 2 === 0 ? hourStartCap : halfStartCap) - reserveNow;
    const maxStart = INTERVALS - c.dur;

    if (!weightsCache[c.dur]) weightsCache[c.dur] = prefWeights(maxStart, p.peakBias);
    const pref = sampleIdxFrom(weightsCache[c.dur], c.prefRoll);

    // only the seats the room actually has are ever handed out, whichever stream asks for them
    const fitsRoom = (s) => {
      const occ = poolOf(s), other = otherOf(s), cap = capBase - reserveNow;
      for (let i = s; i < s + c.dur; i++) if (occ[i] + other[i] + 1 > cap) return false;
      return true;
    };
    // also stays inside the stream's own 50% share
    const fitsShare = (s) => {
      const occ = poolOf(s), cap = streamCap(s);
      for (let i = s; i < s + c.dur; i++) if (occ[i] + 1 > cap) return false;
      return fitsRoom(s);
    };

    const inWindow = (s) => c.flexible || Math.abs(s - pref) <= 1;
    let candidates = startsCache[c.dur].filter((s) => inWindow(s) && fitsShare(s));
    let borrowed = false;
    if (candidates.length === 0) {
      candidates = startsCache[c.dur].filter((s) => inWindow(s) && fitsRoom(s));
      borrowed = candidates.length > 0;
    }

    if (candidates.length === 0) { rej[c.dur]++;
      results.push({ day, date, duration: c.dur === 2 ? '1h' : '2h', flexible: c.flexible, accepted: false, outcome: 'Rejected', startTime: null, model: 'Flex Optimised' });
      continue; }

    let pick;
    if (p.smart && c.flexible) {
      let best = -Infinity;
      for (const s of candidates) {
        const occ = poolOf(s), other = otherOf(s);
        let load = 0;
        for (let i = s; i < s + c.dur; i++) load += occ[i] + other[i];
        const score = load * 100 - Math.abs(s - pref);
        if (score > best) { best = score; pick = s; }
      }
    } else {
      pick = candidates.reduce((a, s) => Math.abs(s - pref) < Math.abs(a - pref) ? s : a, candidates[0]);
    }

    if (borrowed) flexed++;
    const picked = poolOf(pick);
    for (let i = pick; i < pick + c.dur; i++) picked[i]++;

    const row = { day, date, duration: c.dur === 2 ? '1h' : '2h', flexible: c.flexible, accepted: true, outcome: 'Attended', startTime: timeLabel(pick), model: 'Flex Optimised' };
    results.push(row);
    const booking = { pool: picked, start: pick, dur: c.dur, row, live: true };
    booked.push(booking);
    cancels.maybeCancel(k, c, booking, ordered);
  }

  cancels.releaseRemaining();
  const occ = occOnHour.map((v, i) => v + occOnHalf[i]);
  return { occ, ...attendance(booked, p), cancelled: cancels.count, flexed, req, rej, results };
}

function simulateFlexOptimised(p, seed) {
  const occSum = new Array(INTERVALS).fill(0);
  let used = 0, turnedAway = 0, turnedAwayHours = 0, cancelled = 0, seated = 0, flexed = 0, req1 = 0, req2 = 0, rej1 = 0, rej2 = 0;
  let allResults = [];
  for (let t = 0; t < TRIALS; t++) {
    const r = runTrialFlexOptimised(p, buildDemand(p, demandSeed(seed, t)), t);
    r.occ.forEach((v, i) => (occSum[i] += v));
    used += r.used; turnedAway += r.turnedAway; turnedAwayHours += r.turnedAwaySeatHours; cancelled += r.cancelled;
    flexed += r.flexed;
    seated += r.results.filter((x) => x.outcome === 'Attended').length;
    req1 += r.req[2]; req2 += r.req[4];
    rej1 += r.rej[2]; rej2 += r.rej[4];
    allResults = allResults.concat(r.results);
  }
  return {
    avgOcc: occSum.map((v) => v / TRIALS),
    utilisation: used / TRIALS / (p.seats * INTERVALS),
    soldSeatHours: used / TRIALS / 2,
    turnedAway: turnedAway / TRIALS,
    turnedAwayRate: turnedAway + seated ? turnedAway / (turnedAway + seated) : 0,
    turnedAwaySeatHours: turnedAwayHours / TRIALS / 2,
    cancellations: cancelled / TRIALS,
    flexedBookings: flexed / TRIALS,
    rej1Rate: req1 ? rej1 / req1 : 0,
    rej2Rate: req2 ? rej2 / req2 : 0,
    successRate: req1 + req2 ? 1 - (rej1 + rej2) / (req1 + req2) : 0,
    results: allResults,
  };
}

// ---------- model B: advanced (index2.html) ----------
function runTrialAdv(p, rand) {
  const occ = new Array(INTERVALS).fill(0);
  const n = p.demand;
  const capBase = p.seats + p.overbook;
  const customers = [];
  for (let k = 0; k < n; k++) {
    customers.push({
      dur: rand() < p.twoHourShare / 100 ? 4 : 2,
      flexible: rand() < p.lastMinuteShare / 100,
    });
  }
  const planners = customers.filter((c) => !c.flexible);
  const flex = customers.filter((c) => c.flexible);
  shuffle(planners, rand);
  shuffle(flex, rand);
  const ordered = [...planners, ...flex];
  const earlyCount = planners.length;

  const cancelMap = new Map();
  const insideCutoff = [];
  const scheduleCancel = (k, s, dur) => {
    if (rand() < p.lateCancelShare / 100) { insideCutoff.push([s, dur]); return; }
    const at = k + 1 + Math.floor(rand() * (n - k));
    if (at >= n) { insideCutoff.push([s, dur]); return; }
    if (!cancelMap.has(at)) cancelMap.set(at, []);
    cancelMap.get(at).push([s, dur]);
  };
  const applyCancels = (k) => {
    const list = cancelMap.get(k);
    if (!list) return;
    for (const [s, dur] of list) for (let i = s; i < s + dur; i++) occ[i]--;
    cancelMap.delete(k);
  };

  const weightsCache = {};
  const startsCache = { 2: validStarts(2, p.hourAlign), 4: validStarts(4, p.hourAlign) };
  const req = { 2: 0, 4: 0 };
  const rej = { 2: 0, 4: 0 };
  let soldIntervals = 0;

  for (let k = 0; k < n; k++) {
    applyCancels(k);
    const c = ordered[k];
    const late = k >= earlyCount;
    req[c.dur]++;
    const reserveNow = c.dur === 2 && !(p.releaseReserve && late) ? p.reserve : 0;
    const cap = capBase - reserveNow;
    const maxStart = INTERVALS - c.dur;
    if (!weightsCache[c.dur]) weightsCache[c.dur] = prefWeights(maxStart, p.peakBias);
    const pref = sampleIdx(weightsCache[c.dur], rand);
    const feasible = (s) => {
      for (let i = s; i < s + c.dur; i++) if (occ[i] + 1 > cap) return false;
      return true;
    };
    let candidates;
    if (c.flexible) {
      candidates = startsCache[c.dur].filter(feasible);
    } else {
      const window = rand() < p.incentive / 100 ? 4 : 1;
      candidates = startsCache[c.dur].filter((s) => Math.abs(s - pref) <= window && feasible(s));
    }
    if (candidates.length === 0) { rej[c.dur]++; continue; }
    let pick;
    if (p.smart) {
      let best = -Infinity;
      for (const s of candidates) {
        let load = 0;
        for (let i = s; i < s + c.dur; i++) load += occ[i];
        const score = load * 100 - Math.abs(s - pref);
        if (score > best) { best = score; pick = s; }
      }
    } else {
      pick = candidates.reduce((a, s) => Math.abs(s - pref) < Math.abs(a - pref) ? s : a, candidates[0]);
    }
    for (let i = pick; i < pick + c.dur; i++) occ[i]++;
    soldIntervals += c.dur;
    if (rand() < p.cancelRate / 100) scheduleCancel(k, pick, c.dur);
  }

  for (const at of [...cancelMap.keys()]) applyCancels(at);
  let deadIntervals = 0;
  for (const [s, dur] of insideCutoff) {
    for (let i = s; i < s + dur; i++) occ[i]--;
    deadIntervals += dur;
  }

  let attended = 0, bumped = 0;
  for (const v of occ) {
    attended += Math.min(v, p.seats);
    bumped += Math.max(0, v - p.seats);
  }
  return { occ, attended, bumped, sold: soldIntervals, dead: deadIntervals, req, rej };
}

function simulateAdv(p, seed) {
  const rand = mulberry32(seed);
  const occSum = new Array(INTERVALS).fill(0);
  let attended = 0, bumped = 0, sold = 0, dead = 0, req1 = 0, req2 = 0, rej1 = 0, rej2 = 0;
  for (let t = 0; t < TRIALS; t++) {
    const r = runTrialAdv(p, rand);
    r.occ.forEach((v, i) => (occSum[i] += v));
    attended += r.attended; bumped += r.bumped; sold += r.sold; dead += r.dead;
    req1 += r.req[2]; req2 += r.req[4];
    rej1 += r.rej[2]; rej2 += r.rej[4];
  }
  return {
    avgOcc: occSum.map((v) => v / TRIALS),
    utilisation: attended / TRIALS / (p.seats * INTERVALS),
    filledSeatHours: attended / TRIALS / 2,
    paidSeatHours: (sold - bumped) / TRIALS / 2,
    deadSeatHours: dead / TRIALS / 2,
    bumpedSeatHours: bumped / TRIALS / 2,
    rej1Rate: req1 ? rej1 / req1 : 0,
    rej2Rate: req2 ? rej2 / req2 : 0,
  };
}

// Per-centre figures are read side by side, so they need more trials than the sweep chart
function centreSuccessRate(runTrial, p, seed) {
  let req = 0, rej = 0;
  for (let t = 0; t < CENTRE_TRIALS; t++) {
    const r = runTrial(p, buildDemand(p, demandSeed(seed, t)));
    req += r.req[2] + r.req[4];
    rej += r.rej[2] + r.rej[4];
  }
  return req ? 1 - rej / req : 0;
}

// Booking success rate for one seat count, using fewer trials than the headline metrics
function sweepSuccessRate(runTrial, p, seed) {
  let req = 0, rej = 0;
  for (let t = 0; t < SWEEP_TRIALS; t++) {
    const r = runTrial(p, buildDemand(p, demandSeed(seed, t)));
    req += r.req[2] + r.req[4];
    rej += r.rej[2] + r.rej[4];
  }
  return req ? 1 - rej / req : 0;
}

// Success rate of every model across a range of seat counts
function sweepSeats(p, seed) {
  const q = p.twoHourShare / 100;
  // the 1h stream is the last to catch up, so its capacity sets the upper end of the chart
  const catchUp = (4 * p.demand * (1 - q)) / INTERVALS;
  const maxSeats = Math.max(10, Math.ceil(catchUp * 1.3));
  const step = Math.max(1, Math.round(maxSeats / SWEEP_POINTS));
  const points = [];
  for (let m = step; m <= maxSeats; m += step) {
    const scenario = { ...p, seats: m, reserve: Math.min(p.reserve, m - 1) };
    points.push({
      seats: m,
      s1: sweepSuccessRate(runTrialFlowOptimised, scenario, seed),
      s2: sweepSuccessRate(runTrialUtilisationOptimised, scenario, seed),
      s3: sweepSuccessRate(runTrialFlexOptimised, scenario, seed),
    });
  }
  return points;
}

function SeatsChart({ points, seats }) {
  const W = 640, H = 260, L = 44, R = 12, T = 14, B = 34;
  const maxSeats = points[points.length - 1].seats;
  const x = (m) => L + (m / maxSeats) * (W - L - R);
  const y = (v) => T + (1 - v) * (H - T - B);
  const line = (key) => points.map((p) => `${x(p.seats)},${y(p[key])}`).join(" ");
  const gapArea = [
    ...points.map((p) => `${x(p.seats)},${y(p.s2)}`),
    ...points.slice().reverse().map((p) => `${x(p.seats)},${y(p.s1)}`),
  ].join(" ");
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto" }}>
      {[0, 0.25, 0.5, 0.75, 1].map((v) => (
        <g key={v}>
          <line x1={L} x2={W - R} y1={y(v)} y2={y(v)} stroke="#D8DFDD" strokeWidth="1" />
          <text x={L - 8} y={y(v) + 4} textAnchor="end" fontSize="11" fill="#6C7A77">{v * 100}%</text>
        </g>
      ))}
      <polygon points={gapArea} fill="#0E5B4A" opacity="0.12" />
      <polyline points={line("s1")} fill="none" stroke="#8A9A96" strokeWidth="2.5" />
      <polyline points={line("s2")} fill="none" stroke="#0E5B4A" strokeWidth="2.5" />
      <polyline points={line("s3")} fill="none" stroke="#2F6FB5" strokeWidth="2.5" strokeDasharray="6 3" />
      {seats <= maxSeats && (
        <g>
          <line x1={x(seats)} x2={x(seats)} y1={T} y2={H - B} stroke="#172422" strokeDasharray="4 3" strokeWidth="1" />
          <text x={x(seats)} y={T + 10} textAnchor="middle" fontSize="11" fill="#172422">you are here</text>
        </g>
      )}
      {points.filter((_, i) => i % 2 === 0).map((p) => (
        <text key={p.seats} x={x(p.seats)} y={H - B + 16} textAnchor="middle" fontSize="11" fill="#6C7A77">{p.seats}</text>
      ))}
      <text x={(L + W - R) / 2} y={H - 4} textAnchor="middle" fontSize="11" fill="#6C7A77">Number of seats in the test centre</text>
    </svg>
  );
}

// Every model at every centre, with demand scaled to the size of the room so each centre sits
// under the same pressure as the scenario on screen rather than the same absolute queue
function centreKpis(p, seed) {
  const bySeats = new Map();
  for (const c of TEST_CENTRES) {
    if (bySeats.has(c.terminals)) continue;
    const scenario = {
      ...p,
      seats: c.terminals,
      demand: Math.max(1, Math.round((p.demand * c.terminals) / p.seats)),
      reserve: Math.min(p.reserve, c.terminals - 1),
      overbook: Math.min(p.overbook, c.terminals),
    };
    bySeats.set(c.terminals, {
      s1: centreSuccessRate(runTrialFlowOptimised, scenario, seed),
      s2: centreSuccessRate(runTrialUtilisationOptimised, scenario, seed),
      s3: centreSuccessRate(runTrialFlexOptimised, scenario, seed),
    });
  }
  return TEST_CENTRES.map((c) => {
    const r = bySeats.get(c.terminals);
    const ranked = MODEL_KEYS.slice().sort((a, b) => r[b] - r[a]);
    const margin = r[ranked[0]] - r[ranked[1]];
    return { ...c, ...r, best: margin < TIE_MARGIN ? null : ranked[0], margin };
  });
}

// Which model wins most often, by how much, and whether the size of the room changes the answer
function kpiVerdict(rows) {
  const wins = { s1: 0, s2: 0, s3: 0, tied: 0 };
  for (const r of rows) wins[r.best || "tied"]++;
  const meanOf = (set, k) => set.reduce((a, r) => a + r[k], 0) / set.length;
  const rank = (set) => {
    const means = { s1: meanOf(set, "s1"), s2: meanOf(set, "s2"), s3: meanOf(set, "s3") };
    const order = MODEL_KEYS.slice().sort((a, b) => means[b] - means[a]);
    return { means, best: order[0], runnerUp: order[1], lead: means[order[0]] - means[order[1]] };
  };
  const overall = rank(rows);
  const bands = SIZE_BANDS
    .map((b) => ({ ...b, rows: rows.filter((r) => r.terminals >= b.min && r.terminals <= b.max) }))
    .filter((b) => b.rows.length > 0)
    .map((b) => ({ label: b.label, count: b.rows.length, ...rank(b.rows) }));
  return { wins, bands, ...overall };
}

// The difference is taken between the figures as displayed, so two panels showing the same number
// never report a change
function Delta({ a, b, higherIsBetter = true, digits = 1, scale = 1, unit = "" }) {
  const shown = (v) => Number((v * scale).toFixed(digits));
  const diff = shown(b) - shown(a);
  if (diff === 0) return <span className="delta flat">no change</span>;
  const good = higherIsBetter ? diff > 0 : diff < 0;
  return (
    <span className={`delta ${good ? "up" : "down"}`}>
      {diff > 0 ? "+" : ""}{diff.toFixed(digits)}{unit}
    </span>
  );
}

function App() {
  // shared params (all models)
  const [seats, setSeats] = useState(30);
  const [centre, setCentre] = useState("");
  const [demand, setDemand] = useState(280);
  const [twoHourShare, setTwoHourShare] = useState(5);
  const [peakBias, setPeakBias] = useState(50);
  const [lastMinuteShare, setLastMinuteShare] = useState(40);
  const [hourAlign, setHourAlign] = useState(true);
  const [smart, setSmart] = useState(true);
  const [reserve, setReserve] = useState(0);
  const [overbook, setOverbook] = useState(0);
  const [cancelRate, setCancelRate] = useState(0);
  const [rebookShare, setRebookShare] = useState(0);

  const [seed, setSeed] = useState(1);

  const shared = { seats, demand, twoHourShare, peakBias, lastMinuteShare, hourAlign, smart, reserve, overbook, cancelRate, rebookShare };
  const inputs = [seats, demand, twoHourShare, peakBias, lastMinuteShare, hourAlign, smart, reserve, overbook, cancelRate, rebookShare, seed];

  const model1 = useMemo(() => simulateFlowOptimised(shared, seed), inputs);
  const model2 = useMemo(() => simulateUtilisationOptimised(shared, seed), inputs);
  const model3 = useMemo(() => simulateFlexOptimised(shared, seed), inputs);

  const pct = (v) => (v * 100).toFixed(1) + "%";

  const pickCentre = (name) => {
    setCentre(name);
    const found = TEST_CENTRES.find((c) => c.name === name);
    if (found) setSeats(found.terminals);
  };

  // moving the seat count by hand no longer describes any one centre
  const pickSeats = (v) => {
    setSeats(v);
    setCentre("");

  const days = useMemo(() => {
    const out = [];
    for (let d = 0; d < SAMPLE_DAYS; d++) {
      const demand = buildDemand(shared, demandSeed(seed, d));
      const t1 = runTrialFlowOptimised(shared, demand, d);
      const t2 = runTrialUtilisationOptimised(shared, demand, d);
      const t3 = runTrialFlexOptimised(shared, demand, d);
      out.push({
        ...bookingDay(d),
        occ1: t1.seatedOcc,
        occ2: t2.seatedOcc,
        occ3: t3.seatedOcc,
        held1: t1.occ,
        held2: t2.occ,
        held3: t3.occ,
        results: [...t1.results, ...t2.results, ...t3.results],
      });
    }
    return out;
  }, inputs);

  const allResults = useMemo(() => days.flatMap((d) => d.results), [days]);

  // Seat-hours actually sat in across the fortnight on screen, so the figure is an exact count
  const fortnightSeatHours = useMemo(() => {
    const total = (key) => days.reduce((a, d) => a + d[key].reduce((s, v) => s + v, 0), 0) / 2;
    return { m1: total("occ1"), m2: total("occ2"), m3: total("occ3") };
  }, [days]);

  const seatsSweep = useMemo(() => sweepSeats(shared, seed), inputs);

  const centreRows = useMemo(() => centreKpis(shared, seed), inputs);
  const verdict = useMemo(() => kpiVerdict(centreRows), [centreRows]);

  // where the models are furthest apart, and where they have all but converged again
  const spread = (p) => Math.max(p.s1, p.s2, p.s3) - Math.min(p.s1, p.s2, p.s3);
  const peakPoint = seatsSweep.reduce((a, p) => (spread(p) > spread(a) ? p : a), seatsSweep[0]);
  const nameOf = { s1: "Model 1", s2: "Model 2", s3: "Model 3" };
  const peakBest = ["s1", "s2", "s3"].reduce((a, k) => (peakPoint[k] > peakPoint[a] ? k : a), "s1");
  const peakWorst = ["s1", "s2", "s3"].reduce((a, k) => (peakPoint[k] < peakPoint[a] ? k : a), "s1");
  const currentLead = Math.round((model3.successRate - Math.max(model1.successRate, model2.successRate)) * 100);
  const currentRunnerUp = model2.successRate >= model1.successRate ? "Model 2" : "Model 1";
  const closed = seatsSweep.find((p) => p.seats > peakPoint.seats && spread(p) < 0.01);
  const catchUpSeats = closed ? closed.seats : seatsSweep[seatsSweep.length - 1].seats;

  // Preview a few rows per model per day so the table spans the whole fortnight
  const previewRows = useMemo(() => {
    const perGroup = {};
    return allResults.filter((r) => {
      const key = `${r.date}|${r.model}`;
      perGroup[key] = (perGroup[key] || 0) + 1;
      return perGroup[key] <= SAMPLE_PREVIEW_PER_DAY;
    });
  }, [allResults]);

  // Convert results to CSV
  const downloadCSV = () => {
    const headers = ['Model', 'Day', 'Date', 'Duration', 'Flexible', 'Accepted', 'Outcome', 'Start Time'];
    const rows = allResults.map(r => [
      r.model,
      r.day,
      r.date,
      r.duration,
      r.flexible ? 'Yes' : 'No',
      r.accepted ? 'Yes' : 'No',
      r.outcome,
      r.startTime || 'N/A'
    ]);
    
    const csvContent = [
      headers.join(','),
      ...rows.map(row => row.join(','))
    ].join('\n');
    
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    const url = URL.createObjectURL(blob);
    link.setAttribute('href', url);
    link.setAttribute('download', `booking-simulation-${seed}.csv`);
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  return (

          <div className="panel">

            <div className="card">
              <div className="k">Centres won</div>
              <div className="v mono">
                {verdict.wins.s1} / {verdict.wins.s2} / {verdict.wins.s3}
              </div>
              <div className="n">
                Model 1 / Model 2 / Model 3, with {verdict.wins.tied} centres too close to call
                (under {(TIE_MARGIN * 100).toFixed(1)}pp apart).
              </div>
            </div>
            {verdict.bands.map((b) => (
              <div key={b.label} className="card">
                <div className="k">{b.label}</div>
                <div className="v">{MODEL_NAMES[b.best]}</div>
                <div className="n">
                  {pct(b.means[b.best])} across {b.count} centres,{" "}
                  {b.lead < TIE_MARGIN
                    ? `level with ${MODEL_NAMES[b.runnerUp]}`
                    : `${(b.lead * 100).toFixed(1)}pp ahead of ${MODEL_NAMES[b.runnerUp]}`}.
                </div>
              </div>
            ))}
          </div>
          <CentreKpiTable rows={centreRows} centre={centre} onPick={pickCentre} />
          <p className="note">
            Booking success rate per model, in percent, for every centre run at its own number of terminals.
            Demand is scaled with the size of the room ({demand} requests at {seats} seats), so every centre faces the
            same pressure per terminal as the scenario above and only the allocation strategy differs.
            Each figure is {CENTRE_TRIALS} simulated days. Click a row to load that centre into the controls.
          </p>
        </div>
      </div>

      <div style={{ maxWidth: 1720, margin: "18px auto 0" }}>
        <div className="panel">
          <h2>Which model serves more people as you add seats?</h2>
          <div className="chart-grid">
            <div>
              <div className="legend">
                <span><i style={{ background: "#0E5B4A" }} /> Model 2: one shared pool of seats</span>
                <span><i style={{ background: "#8A9A96" }} /> Model 1: seats split 50/50 into two pools</span>
                <span><i style={{ background: "#2F6FB5" }} /> Model 3: 50/50 split that lends out spare seats</span>
              </div>
              <SeatsChart points={seatsSweep} seats={seats} />
              <p className="note" style={{ marginTop: 0 }}>
                Each line shows how many out of every 100 people asking for a test get one, at that number of seats.
                The shaded band is the gap between Models 1 and 2; the dashed line is Model 3.
              </p>
            </div>
            <div className="story">
              <p>
                Model 1 keeps two separate piles of seats: one pile only for tests that start on the hour, the
                other only for tests that start at half past. Model 2 keeps every seat in one pile and gives a
                free seat to whoever asks next. Model 3 starts from Model 1's two piles, but when one pile runs
                out it takes from the other pile rather than saying no — so it never holds a seat empty that
                someone in front of it could sit in.
              </p>
              <p>
                <b>With very few seats</b> every model is full all day, so they turn away almost the same people.
                Sharing seats does not help when there is nothing spare to share.
              </p>
              <p>
                <b>In the middle</b> the two models pull apart, and which one wins depends on your settings.
                Model 2 wins when lots of people want the same length of test at the same time, because it can
                lend any spare seat to anyone. Model 1 wins when tidy start times matter more, because everyone
                in a pile starts together and fewer awkward half-hour gaps are left that nothing fits into.
                The gap is biggest at about <b>{peakPoint.seats} seats</b>, where{" "}
                <b>{nameOf[peakBest]}</b> says yes to{" "}
                {Math.round(peakPoint[peakBest] * 100)} people out of 100 and <b>{nameOf[peakWorst]}</b> only{" "}
                {Math.round(peakPoint[peakWorst] * 100)}.
              </p>
              <p>
                Model 3 is the safety net between the two: it keeps the tidy 50/50 shape whenever demand for the
                two start times is balanced, and only borrows across the split when a customer would otherwise be
                turned away. At your current settings it does that for about{" "}
                <b>{model3.flexedBookings.toFixed(0)} bookings a day</b>.
              </p>
              <p>
                <b>With plenty of seats</b> the difference fades: from about <b>{catchUpSeats} seats</b> there are
                enough seats in every pile for everyone who asks, so every model says yes to nearly everybody.
              </p>
              <p>
                So the split into fixed piles only matters while one pile is the bottleneck. At{" "}
                {centre ? `${centre}'s ${seats} terminals` : `your current ${seats} seats`}, {currentLead === 0 ? `Model 3 serves about the same number of people as ${currentRunnerUp}` : currentLead > 0 ? (
                  <>
                    <b>Model 3</b> serves about <b>{currentLead} more people in every 100 who ask</b> than{" "}
                    {currentRunnerUp}
                  </>
                ) : (
                  <>
                    <b>{currentRunnerUp}</b> serves about <b>{Math.abs(currentLead)} more people in every 100 who
                    ask</b> than Model 3
                  </>
                )}.
              </p>
            </div>
          </div>
        </div>
      </div>

      <div style={{ maxWidth: 1720, margin: "18px auto 0" }}>
        <div className="panel">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <h2>Sample data ({allResults.length.toLocaleString()} bookings over {SAMPLE_DAYS} trading days)</h2>
            <button className="download-btn" onClick={downloadCSV}>Download CSV</button>
          </div>
          <div style={{ maxHeight: 300, overflow: "auto", border: "1px solid #D8DFDD", borderRadius: 8 }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
              <thead style={{ position: "sticky", top: 0, background: "#F7F9F8" }}>
                <tr>
                  <th style={{ padding: "8px 12px", textAlign: "left", borderBottom: "1px solid #D8DFDD", fontWeight: 600, color: "#6C7A77" }}>Model</th>
                  <th style={{ padding: "8px 12px", textAlign: "left", borderBottom: "1px solid #D8DFDD", fontWeight: 600, color: "#6C7A77" }}>Day</th>
                  <th style={{ padding: "8px 12px", textAlign: "left", borderBottom: "1px solid #D8DFDD", fontWeight: 600, color: "#6C7A77" }}>Date</th>
                  <th style={{ padding: "8px 12px", textAlign: "left", borderBottom: "1px solid #D8DFDD", fontWeight: 600, color: "#6C7A77" }}>Duration</th>
                  <th style={{ padding: "8px 12px", textAlign: "left", borderBottom: "1px solid #D8DFDD", fontWeight: 600, color: "#6C7A77" }}>Flexible</th>
                  <th style={{ padding: "8px 12px", textAlign: "left", borderBottom: "1px solid #D8DFDD", fontWeight: 600, color: "#6C7A77" }}>Accepted</th>
                  <th style={{ padding: "8px 12px", textAlign: "left", borderBottom: "1px solid #D8DFDD", fontWeight: 600, color: "#6C7A77" }}>Outcome</th>
                  <th style={{ padding: "8px 12px", textAlign: "left", borderBottom: "1px solid #D8DFDD", fontWeight: 600, color: "#6C7A77" }}>Start Time</th>
                </tr>
              </thead>
              <tbody>
                {previewRows.map((r, i) => (
                  <tr key={i} style={{ borderBottom: "1px solid #E3E9E7" }}>
                    <td style={{ padding: "8px 12px", color: r.model === 'Flow Optimised' ? "#45524F" : r.model === 'Flex Optimised' ? "#2F6FB5" : "#0E5B4A" }}>{r.model}</td>
                    <td style={{ padding: "8px 12px" }}>{r.day}</td>
                    <td style={{ padding: "8px 12px", fontFamily: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" }}>{r.date}</td>
                    <td style={{ padding: "8px 12px" }}>{r.duration}</td>
                    <td style={{ padding: "8px 12px" }}>{r.flexible ? 'Yes' : 'No'}</td>
                    <td style={{ padding: "8px 12px", color: r.accepted ? "#0E5B4A" : "#B5432B" }}>{r.accepted ? 'Yes' : 'No'}</td>
                    <td style={{ padding: "8px 12px", color: r.outcome === 'Attended' ? "#0E5B4A" : "#B5432B" }}>{r.outcome}</td>
                    <td style={{ padding: "8px 12px", fontFamily: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" }}>{r.startTime || 'N/A'}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            {allResults.length > previewRows.length && (
              <p style={{ padding: "12px", color: "#6C7A77", fontSize: 12, textAlign: "center", margin: 0 }}>
                Showing the first {SAMPLE_PREVIEW_PER_DAY} bookings per model per day ({previewRows.length.toLocaleString()} of {allResults.length.toLocaleString()}). Download CSV for full dataset.
              </p>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
