<script type="text/babel">
const { useMemo, useState } = React;

// ---------- shared helpers ----------
const INTERVALS = 16; // 09:00-17:00 in 30-min steps
const TRIALS = 1000;
const SAMPLE_DAYS = 10; // two weeks of trading days in the sample data
const SAMPLE_PREVIEW_PER_DAY = 5;
const SWEEP_TRIALS = 60; // lighter run per seat count, so the seats chart stays responsive
const SWEEP_POINTS = 20;

const timeLabel = (i) => {
  const h = 9 + Math.floor(i / 2);
  return `${h}:${i % 2 ? "30" : "00"}`;
};

const DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

// Each trial represents one trading day; dayIndex 0 is the next business day.
function bookingDay(dayIndex) {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + 1);
  let remaining = dayIndex;
  for (;;) {
    const isWeekday = d.getDay() !== 0 && d.getDay() !== 6;
    if (isWeekday) {
      if (remaining === 0) break;
      remaining--;
    }
    d.setDate(d.getDate() + 1);
  }
  const pad = (v) => String(v).padStart(2, "0");
  return {
    day: DAY_NAMES[d.getDay()],
    date: `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`,
  };
}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(arr, rand) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function prefWeights(maxStart, peakBias) {
  const b = peakBias / 100;
  const w = [];
  for (let i = 0; i <= maxStart; i++) {
    const peaks = Math.exp(-((i - 3) ** 2) / 6) + 0.8 * Math.exp(-((i - 10) ** 2) / 6);
    w.push((1 - b) * 1 + b * 2.2 * peaks);
  }
  return w;
}

function sampleIdx(weights, rand) {
  const total = weights.reduce((a, c) => a + c, 0);
  let r = rand() * total;
  for (let i = 0; i < weights.length; i++) {
    r -= weights[i];
    if (r <= 0) return i;
  }
  return weights.length - 1;
}

function validStarts(dur, hourAlign) {
  const out = [];
  for (let s = 0; s <= INTERVALS - dur; s++) {
    if (dur === 4 && hourAlign && s % 2 !== 0) continue;
    out.push(s);
  }
  return out;
}

// Walk the day forwards and seat people as they arrive. Overbooking can sell more places than the
// room holds, so an arrival that finds every seat taken is turned away and loses its whole booking.
// A booking only ever needs checking at its start: later arrivals test the seat count again.
function attendance(bookings, p) {
  const seated = new Array(INTERVALS).fill(0);
  let turnedAway = 0, turnedAwaySeatHours = 0;
  for (const b of [...bookings].sort((a, b2) => a.start - b2.start)) {
    if (!b.live) continue;
    if (seated[b.start] >= p.seats) {
      turnedAway++;
      turnedAwaySeatHours += b.dur;
      b.row.outcome = 'Turned away';
      continue;
    }
    for (let i = b.start; i < b.start + b.dur; i++) seated[i]++;
    b.row.outcome = 'Attended';
  }
  return { seatedOcc: seated, used: seated.reduce((a, v) => a + v, 0), turnedAway, turnedAwaySeatHours };
}

// Cancellations hand the seat back part-way through the booking window, so later customers can take
// it; a share of the customers who cancel come back with a fresh request of their own
class CancelBook {
  constructor(rand, p) {
    this.rand = rand;
    this.p = p;
    this.due = new Map();
    this.late = [];
    this.count = 0;
  }

  maybeCancel(k, c, booking, queue) {
    if (this.rand() >= this.p.cancelRate / 100) return;
    this.count++;
    const horizon = queue.length;
    const at = k + 1 + Math.floor(this.rand() * Math.max(1, horizon - k));
    if (at < horizon) {
      if (!this.due.has(at)) this.due.set(at, []);
      this.due.get(at).push(booking);
    } else {
      this.late.push(booking);
    }
    const rebooks = this.rand() < this.p.rebookShare / 100;
    if (rebooks && horizon < this.p.demand * 2) queue.push({ dur: c.dur, flexible: c.flexible });
  }

  release(b) {
    b.live = false;
    b.row.outcome = 'Cancelled';
    for (let i = b.start; i < b.start + b.dur; i++) b.pool[i]--;
  }

  releaseDue(k) {
    const list = this.due.get(k);
    if (!list) return;
    for (const b of list) this.release(b);
    this.due.delete(k);
  }

  // seats freed too late for anyone else to take them still empty out on the day
  releaseRemaining() {
    for (const k of [...this.due.keys()]) this.releaseDue(k);
    for (const b of this.late) this.release(b);
    this.late = [];
  }
}

// ---------- model A: basic (index.html) ----------
function runTrialBasic(p, rand) {
  const occ = new Array(INTERVALS).fill(0);
  const n = p.demand;
  const customers = [];
  for (let k = 0; k < n; k++) {
    customers.push({
      dur: rand() < p.twoHourShare / 100 ? 4 : 2,
      flexible: rand() < p.lastMinuteShare / 100,
    });
  }
  const planners = customers.filter((c) => !c.flexible);
  const flex = customers.filter((c) => c.flexible);
  shuffle(planners, rand);
  shuffle(flex, rand);
  const ordered = [...planners, ...flex];
  const weightsCache = {};
  const startsCache = { 2: validStarts(2, p.hourAlign), 4: validStarts(4, p.hourAlign) };
  const req = { 2: 0, 4: 0 };
  const rej = { 2: 0, 4: 0 };
  for (const c of ordered) {
    req[c.dur]++;
    const cap = c.dur === 2 ? p.seats - p.reserve : p.seats;
    const maxStart = INTERVALS - c.dur;
    if (!weightsCache[c.dur]) weightsCache[c.dur] = prefWeights(maxStart, p.peakBias);
    const pref = sampleIdx(weightsCache[c.dur], rand);
    const feasible = (s) => {
      for (let i = s; i < s + c.dur; i++) if (occ[i] + 1 > cap) return false;
      return true;
    };
    let candidates;
    if (c.flexible) {
      candidates = startsCache[c.dur].filter(feasible);
    } else {
      candidates = startsCache[c.dur].filter((s) => Math.abs(s - pref) <= 1 && feasible(s));
    }
    if (candidates.length === 0) { rej[c.dur]++; continue; }
    let pick;
    if (p.smart) {
      let best = -Infinity;
      for (const s of candidates) {
        let load = 0;
        for (let i = s; i < s + c.dur; i++) load += occ[i];
        const score = load * 100 - Math.abs(s - pref);
        if (score > best) { best = score; pick = s; }
      }
    } else {
      pick = candidates.reduce((a, s) => Math.abs(s - pref) < Math.abs(a - pref) ? s : a, candidates[0]);
    }
    for (let i = pick; i < pick + c.dur; i++) occ[i]++;
  }
  const used = occ.reduce((a, c) => a + c, 0);
  return { occ, used, req, rej };
}

function simulateBasic(p, seed) {
  const rand = mulberry32(seed);
  const occSum = new Array(INTERVALS).fill(0);
  let used = 0, req1 = 0, req2 = 0, rej1 = 0, rej2 = 0;
  for (let t = 0; t < TRIALS; t++) {
    const r = runTrialBasic(p, rand);
    r.occ.forEach((v, i) => (occSum[i] += v));
    used += r.used;
    req1 += r.req[2]; req2 += r.req[4];
    rej1 += r.rej[2]; rej2 += r.rej[4];
  }
  return {
    avgOcc: occSum.map((v) => v / TRIALS),
    utilisation: used / TRIALS / (p.seats * INTERVALS),
    soldSeatHours: used / TRIALS / 2,
    rej1Rate: req1 ? rej1 / req1 : 0,
    rej2Rate: req2 ? rej2 / req2 : 0,
  };
}

// ---------- Model 1: Flow optimised (50/50 stream constraint) ----------
function runTrialFlowOptimised(p, rand, dayIndex = 0) {
  const { day, date } = bookingDay(dayIndex);
  // Streams are start times, not durations: one cohort starts on the hour, the other at :30.
  // Each cohort has its own seats, so occupancy is tracked per cohort.
  const occOnHour = new Array(INTERVALS).fill(0);
  const occOnHalf = new Array(INTERVALS).fill(0);
  const n = p.demand;
  
  // Separate capacity into two streams (handle odd seat counts), including any overbooking allowance
  const capBase = p.seats + p.overbook;
  const hourStartCap = Math.ceil(capBase * 0.5); // 50% for bookings starting on the hour (round up)
  const halfStartCap = capBase - hourStartCap; // Remaining for bookings starting at :30
  
  const customers = [];
  for (let k = 0; k < n; k++) {
    customers.push({
      dur: rand() < p.twoHourShare / 100 ? 4 : 2,
      flexible: rand() < p.lastMinuteShare / 100,
    });
  }
  
  const planners = customers.filter((c) => !c.flexible);
  const flex = customers.filter((c) => c.flexible);
  shuffle(planners, rand);
  shuffle(flex, rand);
  const ordered = [...planners, ...flex];
  
  const weightsCache = {};
  const startsCache = { 2: validStarts(2, p.hourAlign), 4: validStarts(4, p.hourAlign) };
  const req = { 2: 0, 4: 0 };
  const rej = { 2: 0, 4: 0 };
  const cancels = new CancelBook(rand, p);
  
  const results = [];
  const booked = [];
  
  for (let k = 0; k < ordered.length; k++) {
    cancels.releaseDue(k);
    const c = ordered[k];
    req[c.dur]++;
    // A booking draws on the cohort matching its start time, for its whole length
    // (reserve applies to 1-hour bookings only)
    const poolOf = (s) => (s % 2 === 0 ? occOnHour : occOnHalf);
    const capOf = (s) => (s % 2 === 0 ? hourStartCap : halfStartCap) - (c.dur === 2 ? p.reserve : 0);
    const maxStart = INTERVALS - c.dur;
    
    if (!weightsCache[c.dur]) weightsCache[c.dur] = prefWeights(maxStart, p.peakBias);
    const pref = sampleIdx(weightsCache[c.dur], rand);
    
    const feasible = (s) => {
      const occ = poolOf(s), cap = capOf(s);
      for (let i = s; i < s + c.dur; i++) if (occ[i] + 1 > cap) return false;
      return true;
    };
    
    let candidates;
    if (c.flexible) {
      candidates = startsCache[c.dur].filter(feasible);
    } else {
      candidates = startsCache[c.dur].filter((s) => Math.abs(s - pref) <= 1 && feasible(s));
    }
    
    if (candidates.length === 0) { rej[c.dur]++; 
      results.push({ day, date, duration: c.dur === 2 ? '1h' : '2h', flexible: c.flexible, accepted: false, outcome: 'Rejected', startTime: null, model: 'Flow Optimised' });
      continue; }
    
    let pick;
    if (p.smart) {
      let best = -Infinity;
      for (const s of candidates) {
        const occ = poolOf(s);
        let load = 0;
        for (let i = s; i < s + c.dur; i++) load += occ[i];
        const score = load * 100 - Math.abs(s - pref);
        if (score > best) { best = score; pick = s; }
      }
    } else {
      pick = candidates.reduce((a, s) => Math.abs(s - pref) < Math.abs(a - pref) ? s : a, candidates[0]);
    }
    
    const picked = poolOf(pick);
    for (let i = pick; i < pick + c.dur; i++) picked[i]++;

    const row = { day, date, duration: c.dur === 2 ? '1h' : '2h', flexible: c.flexible, accepted: true, outcome: 'Attended', startTime: timeLabel(pick), model: 'Flow Optimised' };
    results.push(row);
    const booking = { pool: picked, start: pick, dur: c.dur, row, live: true };
    booked.push(booking);
    cancels.maybeCancel(k, c, booking, ordered);
  }
  
  cancels.releaseRemaining();
  const occ = occOnHour.map((v, i) => v + occOnHalf[i]);
  return { occ, ...attendance(booked, p), cancelled: cancels.count, req, rej, results };
}

function simulateFlowOptimised(p, seed) {
  const rand = mulberry32(seed);
  const occSum = new Array(INTERVALS).fill(0);
  let used = 0, turnedAway = 0, turnedAwayHours = 0, cancelled = 0, seated = 0, req1 = 0, req2 = 0, rej1 = 0, rej2 = 0;
  let allResults = [];
  const totalCapacity = p.seats * INTERVALS;
  
  for (let t = 0; t < TRIALS; t++) {
    const r = runTrialFlowOptimised(p, rand, t);
    r.occ.forEach((v, i) => (occSum[i] += v));
    used += r.used; turnedAway += r.turnedAway; turnedAwayHours += r.turnedAwaySeatHours; cancelled += r.cancelled;
    seated += r.results.filter((x) => x.outcome === 'Attended').length;
    req1 += r.req[2]; req2 += r.req[4];
    rej1 += r.rej[2]; rej2 += r.rej[4];
    allResults = allResults.concat(r.results);
  }
  return {
    avgOcc: occSum.map((v) => v / TRIALS),
    utilisation: used / TRIALS / totalCapacity,
    soldSeatHours: used / TRIALS / 2,
    turnedAway: turnedAway / TRIALS,
    turnedAwayRate: turnedAway + seated ? turnedAway / (turnedAway + seated) : 0,
    turnedAwaySeatHours: turnedAwayHours / TRIALS / 2,
    cancellations: cancelled / TRIALS,
    rej1Rate: req1 ? rej1 / req1 : 0,
    rej2Rate: req2 ? rej2 / req2 : 0,
    successRate: req1 + req2 ? 1 - (rej1 + rej2) / (req1 + req2) : 0,
    results: allResults,
  };
}

// ---------- Model 2: Utilisation optimised (no stream constraint) ----------
function runTrialUtilisationOptimised(p, rand, dayIndex = 0) {
  const { day, date } = bookingDay(dayIndex);
  const occ = new Array(INTERVALS).fill(0);
  const n = p.demand;
  const capBase = p.seats + p.overbook;
  
  // No 50/50 constraint - use full capacity for both streams
  const customers = [];
  for (let k = 0; k < n; k++) {
    customers.push({
      dur: rand() < p.twoHourShare / 100 ? 4 : 2,
      flexible: rand() < p.lastMinuteShare / 100,
    });
  }
  
  const planners = customers.filter((c) => !c.flexible);
  const flex = customers.filter((c) => c.flexible);
  shuffle(planners, rand);
  shuffle(flex, rand);
  const ordered = [...planners, ...flex];
  
  const weightsCache = {};
  const startsCache = { 2: validStarts(2, p.hourAlign), 4: validStarts(4, p.hourAlign) };
  const req = { 2: 0, 4: 0 };
  const rej = { 2: 0, 4: 0 };
  const cancels = new CancelBook(rand, p);
  
  const results = [];
  const booked = [];
  
  for (let k = 0; k < ordered.length; k++) {
    cancels.releaseDue(k);
    const c = ordered[k];
    req[c.dur]++;
    // Use full capacity for both durations (reserve applies to 1-hour bookings only, consistent with basic model)
    const cap = c.dur === 2 ? capBase - p.reserve : capBase;
    const maxStart = INTERVALS - c.dur;
    
    if (!weightsCache[c.dur]) weightsCache[c.dur] = prefWeights(maxStart, p.peakBias);
    const pref = sampleIdx(weightsCache[c.dur], rand);
    
    const feasible = (s) => {
      for (let i = s; i < s + c.dur; i++) if (occ[i] + 1 > cap) return false;
      return true;
    };
    
    let candidates;
    if (c.flexible) {
      candidates = startsCache[c.dur].filter(feasible);
    } else {
      candidates = startsCache[c.dur].filter((s) => Math.abs(s - pref) <= 1 && feasible(s));
    }
    
    if (candidates.length === 0) { rej[c.dur]++; 
      results.push({ day, date, duration: c.dur === 2 ? '1h' : '2h', flexible: c.flexible, accepted: false, outcome: 'Rejected', startTime: null, model: 'Utilisation Optimised' });
      continue; }
    
    let pick;
    if (p.smart) {
      let best = -Infinity;
      for (const s of candidates) {
        let load = 0;
        for (let i = s; i < s + c.dur; i++) load += occ[i];
        const score = load * 100 - Math.abs(s - pref);
        if (score > best) { best = score; pick = s; }
      }
    } else {
      pick = candidates.reduce((a, s) => Math.abs(s - pref) < Math.abs(a - pref) ? s : a, candidates[0]);
    }
    
    for (let i = pick; i < pick + c.dur; i++) occ[i]++;

    const row = { day, date, duration: c.dur === 2 ? '1h' : '2h', flexible: c.flexible, accepted: true, outcome: 'Attended', startTime: timeLabel(pick), model: 'Utilisation Optimised' };
    results.push(row);
    const booking = { pool: occ, start: pick, dur: c.dur, row, live: true };
    booked.push(booking);
    cancels.maybeCancel(k, c, booking, ordered);
  }
  
  cancels.releaseRemaining();
  return { occ, ...attendance(booked, p), cancelled: cancels.count, req, rej, results };
}

function simulateUtilisationOptimised(p, seed) {
  const rand = mulberry32(seed);
  const occSum = new Array(INTERVALS).fill(0);
  let used = 0, turnedAway = 0, turnedAwayHours = 0, cancelled = 0, seated = 0, req1 = 0, req2 = 0, rej1 = 0, rej2 = 0;
  let allResults = [];
  for (let t = 0; t < TRIALS; t++) {

    r.occ.forEach((v, i) => (occSum[i] += v));
    used += r.used; turnedAway += r.turnedAway; turnedAwayHours += r.turnedAwaySeatHours; cancelled += r.cancelled;
    seated += r.results.filter((x) => x.outcome === 'Attended').length;
    req1 += r.req[2]; req2 += r.req[4];
    rej1 += r.rej[2]; rej2 += r.rej[4];
    allResults = allResults.concat(r.results);
  }
  return {
    avgOcc: occSum.map((v) => v / TRIALS),
    utilisation: used / TRIALS / (p.seats * INTERVALS),
    soldSeatHours: used / TRIALS / 2,
    turnedAway: turnedAway / TRIALS,
    turnedAwayRate: turnedAway + seated ? turnedAway / (turnedAway + seated) : 0,
    turnedAwaySeatHours: turnedAwayHours / TRIALS / 2,
    cancellations: cancelled / TRIALS,
    rej1Rate: req1 ? rej1 / req1 : 0,
    rej2Rate: req2 ? rej2 / req2 : 0,

// ---------- model B: advanced (index2.html) ----------
function runTrialAdv(p, rand) {
  const occ = new Array(INTERVALS).fill(0);
  const n = p.demand;
  const capBase = p.seats + p.overbook;
  const customers = [];
  for (let k = 0; k < n; k++) {
    customers.push({
      dur: rand() < p.twoHourShare / 100 ? 4 : 2,
      flexible: rand() < p.lastMinuteShare / 100,
    });
  }
  const planners = customers.filter((c) => !c.flexible);
  const flex = customers.filter((c) => c.flexible);
  shuffle(planners, rand);
  shuffle(flex, rand);
  const ordered = [...planners, ...flex];
  const earlyCount = planners.length;

  const cancelMap = new Map();
  const insideCutoff = [];
  const scheduleCancel = (k, s, dur) => {
    if (rand() < p.lateCancelShare / 100) { insideCutoff.push([s, dur]); return; }
    const at = k + 1 + Math.floor(rand() * (n - k));
    if (at >= n) { insideCutoff.push([s, dur]); return; }
    if (!cancelMap.has(at)) cancelMap.set(at, []);
    cancelMap.get(at).push([s, dur]);
  };
  const applyCancels = (k) => {
    const list = cancelMap.get(k);
    if (!list) return;
    for (const [s, dur] of list) for (let i = s; i < s + dur; i++) occ[i]--;
    cancelMap.delete(k);
  };

  const weightsCache = {};
  const startsCache = { 2: validStarts(2, p.hourAlign), 4: validStarts(4, p.hourAlign) };
  const req = { 2: 0, 4: 0 };
  const rej = { 2: 0, 4: 0 };
  let soldIntervals = 0;

  for (let k = 0; k < n; k++) {
    applyCancels(k);
    const c = ordered[k];
    const late = k >= earlyCount;
    req[c.dur]++;
    const reserveNow = c.dur === 2 && !(p.releaseReserve && late) ? p.reserve : 0;
    const cap = capBase - reserveNow;
    const maxStart = INTERVALS - c.dur;
    if (!weightsCache[c.dur]) weightsCache[c.dur] = prefWeights(maxStart, p.peakBias);
    const pref = sampleIdx(weightsCache[c.dur], rand);
    const feasible = (s) => {
      for (let i = s; i < s + c.dur; i++) if (occ[i] + 1 > cap) return false;
      return true;
    };
    let candidates;
    if (c.flexible) {
      candidates = startsCache[c.dur].filter(feasible);
    } else {
      const window = rand() < p.incentive / 100 ? 4 : 1;
      candidates = startsCache[c.dur].filter((s) => Math.abs(s - pref) <= window && feasible(s));
    }
    if (candidates.length === 0) { rej[c.dur]++; continue; }
    let pick;
    if (p.smart) {
      let best = -Infinity;
      for (const s of candidates) {
        let load = 0;
        for (let i = s; i < s + c.dur; i++) load += occ[i];
        const score = load * 100 - Math.abs(s - pref);
        if (score > best) { best = score; pick = s; }
      }
    } else {
      pick = candidates.reduce((a, s) => Math.abs(s - pref) < Math.abs(a - pref) ? s : a, candidates[0]);
    }
    for (let i = pick; i < pick + c.dur; i++) occ[i]++;
    soldIntervals += c.dur;
    if (rand() < p.cancelRate / 100) scheduleCancel(k, pick, c.dur);
  }

  for (const at of [...cancelMap.keys()]) applyCancels(at);
  let deadIntervals = 0;
  for (const [s, dur] of insideCutoff) {
    for (let i = s; i < s + dur; i++) occ[i]--;
    deadIntervals += dur;
  }

  let attended = 0, bumped = 0;
  for (const v of occ) {
    attended += Math.min(v, p.seats);
    bumped += Math.max(0, v - p.seats);
  }
  return { occ, attended, bumped, sold: soldIntervals, dead: deadIntervals, req, rej };
}

function simulateAdv(p, seed) {
  const rand = mulberry32(seed);
  const occSum = new Array(INTERVALS).fill(0);
  let attended = 0, bumped = 0, sold = 0, dead = 0, req1 = 0, req2 = 0, rej1 = 0, rej2 = 0;
  for (let t = 0; t < TRIALS; t++) {
    const r = runTrialAdv(p, rand);
    r.occ.forEach((v, i) => (occSum[i] += v));
    attended += r.attended; bumped += r.bumped; sold += r.sold; dead += r.dead;
    req1 += r.req[2]; req2 += r.req[4];
    rej1 += r.rej[2]; rej2 += r.rej[4];
  }
  return {
    avgOcc: occSum.map((v) => v / TRIALS),
    utilisation: attended / TRIALS / (p.seats * INTERVALS),
    filledSeatHours: attended / TRIALS / 2,
    paidSeatHours: (sold - bumped) / TRIALS / 2,
    deadSeatHours: dead / TRIALS / 2,
    bumpedSeatHours: bumped / TRIALS / 2,
    rej1Rate: req1 ? rej1 / req1 : 0,
    rej2Rate: req2 ? rej2 / req2 : 0,
  };
}

// Booking success rate for one seat count, using fewer trials than the headline metrics
function sweepSuccessRate(runTrial, p, seed) {
  const rand = mulberry32(seed);
  let req = 0, rej = 0;
  for (let t = 0; t < SWEEP_TRIALS; t++) {
    const r = runTrial(p, rand);
    req += r.req[2] + r.req[4];
    rej += r.rej[2] + r.rej[4];
  }
  return req ? 1 - rej / req : 0;
}

// Success rate of both models across a range of seat counts
function sweepSeats(p, seed) {
  const q = p.twoHourShare / 100;
  // the 1h stream is the last to catch up, so its capacity sets the upper end of the chart
  const catchUp = (4 * p.demand * (1 - q)) / INTERVALS;
  const maxSeats = Math.max(10, Math.ceil(catchUp * 1.3));
  const step = Math.max(1, Math.round(maxSeats / SWEEP_POINTS));
  const points = [];
  for (let m = step; m <= maxSeats; m += step) {
    const scenario = { ...p, seats: m, reserve: Math.min(p.reserve, m - 1) };
    points.push({
      seats: m,
      s1: sweepSuccessRate(runTrialFlowOptimised, scenario, seed),
      s2: sweepSuccessRate(runTrialUtilisationOptimised, scenario, seed),
    });
  }
  return points;
}

function SeatsChart({ points, seats }) {
  const W = 640, H = 260, L = 44, R = 12, T = 14, B = 34;
  const maxSeats = points[points.length - 1].seats;
  const x = (m) => L + (m / maxSeats) * (W - L - R);
  const y = (v) => T + (1 - v) * (H - T - B);
  const line = (key) => points.map((p) => `${x(p.seats)},${y(p[key])}`).join(" ");
  const gapArea = [
    ...points.map((p) => `${x(p.seats)},${y(p.s2)}`),
    ...points.slice().reverse().map((p) => `${x(p.seats)},${y(p.s1)}`),
  ].join(" ");
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto" }}>
      {[0, 0.25, 0.5, 0.75, 1].map((v) => (
        <g key={v}>
          <line x1={L} x2={W - R} y1={y(v)} y2={y(v)} stroke="#D8DFDD" strokeWidth="1" />
          <text x={L - 8} y={y(v) + 4} textAnchor="end" fontSize="11" fill="#6C7A77">{v * 100}%</text>
        </g>
      ))}
      <polygon points={gapArea} fill="#0E5B4A" opacity="0.12" />
      <polyline points={line("s1")} fill="none" stroke="#8A9A96" strokeWidth="2.5" />
      <polyline points={line("s2")} fill="none" stroke="#0E5B4A" strokeWidth="2.5" />
      {seats <= maxSeats && (
        <g>
          <line x1={x(seats)} x2={x(seats)} y1={T} y2={H - B} stroke="#172422" strokeDasharray="4 3" strokeWidth="1" />
          <text x={x(seats)} y={T + 10} textAnchor="middle" fontSize="11" fill="#172422">you are here</text>
        </g>
      )}
      {points.filter((_, i) => i % 2 === 0).map((p) => (
        <text key={p.seats} x={x(p.seats)} y={H - B + 16} textAnchor="middle" fontSize="11" fill="#6C7A77">{p.seats}</text>
      ))}
      <text x={(L + W - R) / 2} y={H - 4} textAnchor="middle" fontSize="11" fill="#6C7A77">Number of seats in the test centre</text>
    </svg>
  );
}

function Delta({ a, b, higherIsBetter = true, fmt = (v) => v.toFixed(1) }) {
  const diff = b - a;
  if (Math.abs(diff) < 1e-9) return <span className="delta flat">no change</span>;
  const good = higherIsBetter ? diff > 0 : diff < 0;
  return (
    <span className={`delta ${good ? "up" : "down"}`}>
      {diff > 0 ? "+" : ""}{fmt(diff)}
    </span>
  );
}

              </div>
            </div>
            <h2>Seats filled per half hour, by day</h2>
            <DailyHeatmap days={days} occKey="occ1" seats={seats} />
            {overbook > 0 && (
              <p className="note">People actually seated, so never above {seats}. Bookings held peak at {Math.max(...days.map((d) => Math.max(...d.held1)))} because overbooking sells {overbook} extra place{overbook === 1 ? "" : "s"} per half hour.</p>
            )}
          </div>
        </div>

        <div>
          <div className="colhead"><span className="badge util">Model 2: Utilisation optimised</span></div>
          <p className="colnote">No 50/50 stream constraint. Bookings are accepted based on available capacity and the algorithm tries to maximise utilisation. The hour/half-hour mix can flex based on demand.</p>
          <div className="panel">
            <div className="metrics">
              <div className="metric">
                <div className="k">Booking success rate</div>
                <div className="v mono">{pct(model2.successRate)}</div>
                <div className="d"><Delta a={model1.successRate} b={model2.successRate} fmt={pctPts} /></div>
              </div>
              <div className="metric">
                <div className="k">Utilisation</div>
                <div className="v mono">{pct(model2.utilisation)}</div>
                <div className="d"><Delta a={model1.utilisation} b={model2.utilisation} fmt={pctPts} /></div>
              </div>
              <div className="metric">
                <div className="k">Sold seat-hours</div>
                <div className="v mono">{model2.soldSeatHours.toFixed(0)}</div>
                <div className="d"><Delta a={model1.soldSeatHours} b={model2.soldSeatHours} fmt={(v) => v.toFixed(0)} /></div>
              </div>
              <div className="metric">
                <div className="k">Cancellations / day</div>
                <div className="v mono">{model2.cancellations.toFixed(0)}</div>
                <div className="d"><Delta a={model1.cancellations} b={model2.cancellations} higherIsBetter={false} fmt={(v) => v.toFixed(0)} /></div>
              </div>
              <div className="metric">
                <div className="k">Turned away on arrival / day</div>
                <div className="v mono" style={{ color: model2.turnedAway > 0 ? "#B5432B" : "#172422" }}>{model2.turnedAway.toFixed(1)}</div>
                <div className="d"><Delta a={model1.turnedAway} b={model2.turnedAway} higherIsBetter={false} fmt={(v) => v.toFixed(1)} /> · {pct(model2.turnedAwayRate)} of people who turn up</div>
              </div>
              <div className="metric">
                <div className="k">1h rejections</div>
                <div className="v mono" style={{ color: model2.rej1Rate > 0.02 ? "#B5432B" : "#172422" }}>{pct(model2.rej1Rate)}</div>
                <div className="d"><Delta a={model1.rej1Rate} b={model2.rej1Rate} higherIsBetter={false} fmt={pctPts} /></div>
              </div>
              <div className="metric">
                <div className="k">2h rejections</div>
                <div className="v mono" style={{ color: model2.rej2Rate > 0.02 ? "#B5432B" : "#172422" }}>{pct(model2.rej2Rate)}</div>
                <div className="d"><Delta a={model1.rej2Rate} b={model2.rej2Rate} higherIsBetter={false} fmt={pctPts} /></div>
              </div>
            </div>
            <h2>Seats filled per half hour, by day</h2>
            <DailyHeatmap days={days} occKey="occ2" seats={seats} />
            {overbook > 0 && (
              <p className="note">People actually seated, so never above {seats}. Bookings held peak at {Math.max(...days.map((d) => Math.max(...d.held2)))} because overbooking sells {overbook} extra place{overbook === 1 ? "" : "s"} per half hour.</p>
            )}
          </div>
        </div>
      </div>

      <div style={{ maxWidth: 1320, margin: "18px auto 0" }}>
        <p className="note">
          Booking success rate is the customer-side efficiency measure: accepted requests as a share of
          all requests made, across both durations. Deltas are Model 2 minus Model 1, coloured green when the change is favourable
          (higher success rate, higher utilisation, fewer rejections) and orange when unfavourable. Because both columns
          share one random seed and the same demand/policy inputs, any difference you see comes purely
          from the different capacity allocation strategies — the 50/50 stream constraint vs flexible utilisation.
        </p>
      </div>

      <div style={{ maxWidth: 1320, margin: "18px auto 0" }}>
        <div className="panel">
          <h2>Which model serves more people as you add seats?</h2>
          <div className="chart-grid">
            <div>
              <div className="legend">
                <span><i style={{ background: "#0E5B4A" }} /> Model 2: one shared pool of seats</span>
                <span><i style={{ background: "#8A9A96" }} /> Model 1: seats split 50/50 into two pools</span>
              </div>
              <SeatsChart points={seatsSweep} seats={seats} />
              <p className="note" style={{ marginTop: 0 }}>
                Each line shows how many out of every 100 people asking for a test get one, at that number of seats.
                The shaded band between the lines is the gap between the two models.
              </p>
            </div>
            <div className="story">
              <p>
                Model 1 keeps two separate piles of seats: one pile only for tests that start on the hour, the
                other only for tests that start at half past. Model 2 keeps every seat in one pile and gives a
                free seat to whoever asks next.
              </p>
              <p>
                <b>With very few seats</b> both models are full all day, so they turn away almost the same people.
                Sharing seats does not help when there is nothing spare to share.
              </p>
              <p>
                <b>In the middle</b> the two models pull apart, and which one wins depends on your settings.
                Model 2 wins when lots of people want the same length of test at the same time, because it can
                lend any spare seat to anyone. Model 1 wins when tidy start times matter more, because everyone
                in a pile starts together and fewer awkward half-hour gaps are left that nothing fits into.
                The gap is biggest at about <b>{peakPoint.seats} seats</b>, where{" "}
                <b>{peakLeadsModel2 ? "Model 2" : "Model 1"}</b> says yes to{" "}
                {Math.round(Math.max(peakPoint.s1, peakPoint.s2) * 100)} people out of 100 and the other model only{" "}
                {Math.round(Math.min(peakPoint.s1, peakPoint.s2) * 100)}.
              </p>
              <p>
                <b>With plenty of seats</b> the difference fades: from about <b>{catchUpSeats} seats</b> there are
                enough seats in every pile for everyone who asks, so both models say yes to nearly everybody.
              </p>
              <p>
                So the split into fixed piles only matters while one pile is the bottleneck. At your current{" "}
                {seats} seats, {currentLead === 0 ? "the two models serve about the same number of people" : (
                  <>
                    <b>{currentLead > 0 ? "Model 2" : "Model 1"}</b> serves about <b>{Math.abs(currentLead)} more
                    people in every 100 who ask</b>
                  </>
                )}.
              </p>
            </div>
          </div>
        </div>
      </div>

      <div style={{ maxWidth: 1320, margin: "18px auto 0" }}>
        <div className="panel">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
            <h2>Sample data ({allResults.length.toLocaleString()} bookings over {SAMPLE_DAYS} trading days)</h2>
            <button className="download-btn" onClick={downloadCSV}>Download CSV</button>
          </div>
          <div style={{ maxHeight: 300, overflow: "auto", border: "1px solid #D8DFDD", borderRadius: 8 }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
              <thead style={{ position: "sticky", top: 0, background: "#F7F9F8" }}>
                <tr>
                  <th style={{ padding: "8px 12px", textAlign: "left", borderBottom: "1px solid #D8DFDD", fontWeight: 600, color: "#6C7A77" }}>Model</th>
                  <th style={{ padding: "8px 12px", textAlign: "left", borderBottom: "1px solid #D8DFDD", fontWeight: 600, color: "#6C7A77" }}>Day</th>
                  <th style={{ padding: "8px 12px", textAlign: "left", borderBottom: "1px solid #D8DFDD", fontWeight: 600, color: "#6C7A77" }}>Date</th>
                  <th style={{ padding: "8px 12px", textAlign: "left", borderBottom: "1px solid #D8DFDD", fontWeight: 600, color: "#6C7A77" }}>Duration</th>
                  <th style={{ padding: "8px 12px", textAlign: "left", borderBottom: "1px solid #D8DFDD", fontWeight: 600, color: "#6C7A77" }}>Flexible</th>
                  <th style={{ padding: "8px 12px", textAlign: "left", borderBottom: "1px solid #D8DFDD", fontWeight: 600, color: "#6C7A77" }}>Accepted</th>
                  <th style={{ padding: "8px 12px", textAlign: "left", borderBottom: "1px solid #D8DFDD", fontWeight: 600, color: "#6C7A77" }}>Outcome</th>
                  <th style={{ padding: "8px 12px", textAlign: "left", borderBottom: "1px solid #D8DFDD", fontWeight: 600, color: "#6C7A77" }}>Start Time</th>
                </tr>
              </thead>
              <tbody>
                {previewRows.map((r, i) => (
                  <tr key={i} style={{ borderBottom: "1px solid #E3E9E7" }}>
                    <td style={{ padding: "8px 12px", color: r.model === 'Flow Optimised' ? "#45524F" : "#0E5B4A" }}>{r.model}</td>
                    <td style={{ padding: "8px 12px" }}>{r.day}</td>
                    <td style={{ padding: "8px 12px", fontFamily: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" }}>{r.date}</td>
                    <td style={{ padding: "8px 12px" }}>{r.duration}</td>
                    <td style={{ padding: "8px 12px" }}>{r.flexible ? 'Yes' : 'No'}</td>
                    <td style={{ padding: "8px 12px", color: r.accepted ? "#0E5B4A" : "#B5432B" }}>{r.accepted ? 'Yes' : 'No'}</td>
                    <td style={{ padding: "8px 12px", color: r.outcome === 'Attended' ? "#0E5B4A" : "#B5432B" }}>{r.outcome}</td>
                    <td style={{ padding: "8px 12px", fontFamily: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" }}>{r.startTime || 'N/A'}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            {allResults.length > previewRows.length && (
              <p style={{ padding: "12px", color: "#6C7A77", fontSize: 12, textAlign: "center", margin: 0 }}>
                Showing the first {SAMPLE_PREVIEW_PER_DAY} bookings per model per day ({previewRows.length.toLocaleString()} of {allResults.length.toLocaleString()}). Download CSV for full dataset.
              </p>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
