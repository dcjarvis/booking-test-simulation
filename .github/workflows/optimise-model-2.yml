name: Optimise Model 2
on:
  push:
    branches: [optimise-model-2-some-more]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimise-model-2-some-more
      - name: Replace Model 2 with demand-aware short-horizon optimiser
        shell: python
        run: |
          from pathlib import Path
          path = Path('compare.html')
          text = path.read_text()
          start = text.index('function runTrialUtilisationOptimised(p, demand, dayIndex = 0) {')
          end = text.index('function simulateUtilisationOptimised(p, seed) {', start)
          fn = r'''function runTrialUtilisationOptimised(p, demand, dayIndex = 0) {
  const { day, date } = bookingDay(dayIndex);
  const occ = new Array(INTERVALS).fill(0);
  const capBase = p.seats + p.overbook;
  const ordered = [...demand.ordered];
  const weightsCache = {};
  const startsCache = { 2: validStarts(2, p.hourAlign), 4: validStarts(4, p.hourAlign) };
  const req = { 2: 0, 4: 0 };
  const rej = { 2: 0, 4: 0 };
  const cancels = new CancelBook(p, demand.spare);
  const results = [];
  const booked = [];
  const LOOKAHEAD = 8;
  const FUTURE_WEIGHT = 2.5;
  const PACKING_WEIGHT = 18;
  const PREFERENCE_WEIGHT = 5;
  const TWO_HOUR_PROTECTION_WEIGHT = 14;
  const feasibleOn = (state, s, dur, cap) => {
    for (let i = s; i < s + dur; i++) if (state[i] + 1 > cap) return false;
    return true;
  };
  const preferenceFor = (c) => {
    const maxStart = INTERVALS - c.dur;
    if (!weightsCache[c.dur]) weightsCache[c.dur] = prefWeights(maxStart, p.peakBias);
    return sampleIdxFrom(weightsCache[c.dur], c.prefRoll);
  };
  const futureValue = (state, fromIndex) => {
    const sim = state.slice();
    let accepted = 0;
    let acceptedHours = 0;
    let protectedTwoHour = 0;
    const limit = Math.min(ordered.length, fromIndex + LOOKAHEAD);
    for (let j = fromIndex; j < limit; j++) {
      const future = ordered[j];
      const cap = future.dur === 2 ? capBase - p.reserve : capBase;
      const prefFuture = preferenceFor(future);
      const candidates = startsCache[future.dur].filter((s) => feasibleOn(sim, s, future.dur, cap));
      if (!candidates.length) continue;
      let bestScore = -Infinity;
      let bestStart = candidates[0];
      for (const s of candidates) {
        let load = 0;
        for (let i = s; i < s + future.dur; i++) load += sim[i];
        const packing = load * PACKING_WEIGHT;
        const preference = future.flexible ? Math.abs(s - prefFuture) * 1.5 : Math.abs(s - prefFuture) * PREFERENCE_WEIGHT;
        const score = packing - preference;
        if (score > bestScore) { bestScore = score; bestStart = s; }
      }
      for (let i = bestStart; i < bestStart + future.dur; i++) sim[i]++;
      accepted++;
      acceptedHours += future.dur;
    }
    for (const s of startsCache[4]) if (feasibleOn(sim, s, 4, capBase - p.reserve)) protectedTwoHour++;
    return accepted * 100 + acceptedHours * 8 + protectedTwoHour * 3;
  };
  for (let k = 0; k < ordered.length; k++) {
    cancels.releaseDue(k);
    const c = ordered[k];
    req[c.dur]++;
    const cap = c.dur === 2 ? capBase - p.reserve : capBase;
    const pref = preferenceFor(c);
    const feasible = (s) => feasibleOn(occ, s, c.dur, cap);
    let candidates;
    if (c.flexible) candidates = startsCache[c.dur].filter(feasible);
    else candidates = startsCache[c.dur].filter((s) => Math.abs(s - pref) <= 1 && feasible(s));
    if (!candidates.length) {
      rej[c.dur]++;
      results.push({ day, date, duration: c.dur === 2 ? '1h' : '2h', flexible: c.flexible, accepted: false, outcome: 'Rejected', startTime: null, model: 'Utilisation Optimised' });
      continue;
    }
    let pick = candidates[0];
    let best = -Infinity;
    for (const s of candidates) {
      let load = 0;
      for (let i = s; i < s + c.dur; i++) load += occ[i];
      const packingScore = load * PACKING_WEIGHT;
      const preferencePenalty = Math.abs(s - pref) * (c.flexible ? 1.5 : PREFERENCE_WEIGHT);
      let twoHourPenalty = 0;
      if (c.dur === 2) {
        const before = startsCache[4].filter((x) => feasibleOn(occ, x, 4, capBase - p.reserve)).length;
        const next = occ.slice();
        for (let i = s; i < s + c.dur; i++) next[i]++;
        const after = startsCache[4].filter((x) => feasibleOn(next, x, 4, capBase - p.reserve)).length;
        twoHourPenalty = Math.max(0, before - after) * TWO_HOUR_PROTECTION_WEIGHT;
      }
      const nextOcc = occ.slice();
      for (let i = s; i < s + c.dur; i++) nextOcc[i]++;
      const lookahead = futureValue(nextOcc, k + 1);
      const score = packingScore - preferencePenalty - twoHourPenalty + lookahead * FUTURE_WEIGHT;
      if (score > best) { best = score; pick = s; }
    }
    for (let i = pick; i < pick + c.dur; i++) occ[i]++;
    const row = { day, date, duration: c.dur === 2 ? '1h' : '2h', flexible: c.flexible, accepted: true, outcome: 'Attended', startTime: timeLabel(pick), model: 'Utilisation Optimised' };
    results.push(row);
    const booking = { pool: occ, start: pick, dur: c.dur, row, live: true };
    booked.push(booking);
    cancels.maybeCancel(k, c, booking, ordered);
  }
  cancels.releaseRemaining();
  return { occ, ...attendance(booked, p), cancelled: cancels.count, req, rej, results };
}
'''
          text = text[:start] + fn + text[end:]
          path.write_text(text)
      - name: Commit patched file and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add compare.html .github/workflows/optimise-model-2.yml
          git rm .github/workflows/optimise-model-2.yml
          git commit -m "Make Model 2 demand-aware with short-horizon optimisation"
          git push origin HEAD:optimise-model-2-some-more
